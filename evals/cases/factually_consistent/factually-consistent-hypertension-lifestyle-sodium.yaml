id: factually-consistent-hypertension-lifestyle-sodium
category: factually_consistent
failure_mode: >
  The cited guideline quote must actually support the sodium-target claim,
  not a fabricated number.
question: "What daily sodium intake target is commonly recommended to help lower blood pressure?"
patient_id: 1
retrieved_chunks:
  - chunk_id: "hypertension-lifestyle#common-lifestyle-interventions"
    doc_id: "hypertension-lifestyle"
    title: "Hypertension Lifestyle Management and Follow-Up"
    section: "Common Lifestyle Interventions"
    text: >
      Sodium reduction, commonly targeted around 1,500-2,300 mg/day depending
      on the source guidance. Regular aerobic physical activity, commonly
      cited around 90-150 minutes/week.
assertions:
  - type: verdict
    equals: verified
  - type: guideline_citation_present
xfail: >
  OBSERVED (recorded, qwen3:4b): with no chart-data tool_data provided (a
  guideline-only question), the model either declines to answer at all
  ("outside the scope of patient-specific data retrieval tools") or answers
  correctly in prose but the claim extractor fabricates a plausible-looking
  SourceRef pointing at a tool call that never happened, instead of using
  the provided guideline_chunk document_citations format -- so the claim
  fails citation re-validation (verdict: blocked) even though a real,
  verbatim-quotable guideline chunk was available. This is an honest,
  reproducible P3G.1 finding about the local 4B extraction model, not a
  harness bug -- the assertion (verdict: verified) is the correct target
  and is deliberately not weakened.
