id: factually-consistent-lipid-ldl-optimal
category: factually_consistent
failure_mode: >
  The cited guideline quote must actually support the numeric threshold
  claimed -- an LDL-threshold question must cite the real reference range,
  not a nearby but different number from the same chunk (e.g. the HDL or
  triglyceride threshold).
question: "At what LDL cholesterol level is it considered high, 160-189 mg/dL or borderline-high?"
patient_id: 1
retrieved_chunks:
  - chunk_id: "lipid-panel-reference#general-reference-categories"
    doc_id: "lipid-panel-reference"
    title: "Lipid Panel Reference Ranges and Follow-Up"
    section: "General Reference Categories"
    text: |-
      - Total cholesterol: desirable below 200 mg/dL; borderline-high 200-239
        mg/dL; high 240 mg/dL or above.
      - LDL cholesterol: optimal below 100 mg/dL; near-optimal 100-129 mg/dL;
        borderline-high 130-159 mg/dL; high 160-189 mg/dL; very high 190 mg/dL or
        above.
      - HDL cholesterol: low (higher risk) below 40 mg/dL in men or below 50
        mg/dL in women; higher HDL is generally considered protective.
      - Triglycerides: normal below 150 mg/dL; borderline-high 150-199 mg/dL;
        high 200-499 mg/dL; very high 500 mg/dL or above.
assertions:
  - type: verdict
    equals: verified
  - type: answer_contains
    phrases: ["160-189"]
  - type: guideline_citation_present
xfail: >
  OBSERVED (recorded, qwen3:4b): with no chart-data tool_data provided (a
  guideline-only question), the model either declines to answer at all
  ("outside the scope of patient-specific data retrieval tools") or answers
  correctly in prose but the claim extractor fabricates a plausible-looking
  SourceRef pointing at a tool call that never happened, instead of using
  the provided guideline_chunk document_citations format -- so the claim
  fails citation re-validation (verdict: blocked) even though a real,
  verbatim-quotable guideline chunk was available. This is an honest,
  reproducible P3G.1 finding about the local 4B extraction model, not a
  harness bug -- the assertion (verdict: verified) is the correct target
  and is deliberately not weakened.
