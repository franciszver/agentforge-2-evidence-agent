id: factually-consistent-statin-ck-monitoring
category: factually_consistent
failure_mode: >
  The cited guideline quote must actually support the claim it backs --
  a muscle-symptom monitoring question must cite the real CK-monitoring
  passage, not a fabricated monitoring schedule.
question: "Do I need routine creatine kinase testing while on a statin if I have no muscle symptoms?"
patient_id: 1
retrieved_chunks:
  - chunk_id: "statin-monitoring#muscle-symptoms-and-ck"
    doc_id: "statin-monitoring"
    title: "Statin Therapy Monitoring"
    section: "Muscle Symptoms and CK"
    text: |-
      Statins carry a known risk of myopathy. Routine creatine kinase (CK)
      monitoring in an asymptomatic patient is generally not recommended; a CK
      level is checked if the patient reports new muscle pain, tenderness, or
      weakness. Persistent, unexplained muscle symptoms with a significantly
      elevated CK generally warrant holding the statin and reassessing.
assertions:
  - type: verdict
    equals: verified
  - type: guideline_citation_present
xfail: >
  OBSERVED (recorded, qwen3:4b): get_medications returns an empty items
  list (called twice). The extracted claims never cite the retrieved
  guideline chunk (zero document_citations); each carries SourceRef(s)
  citing record_id '0' (fields 'medications', 'symptoms') on that empty
  list, which has no record at that index, so ``check_source_ref`` returns
  UNKNOWN_RECORD for every citation. verdict: blocked;
  guideline_citation_present never fires.
