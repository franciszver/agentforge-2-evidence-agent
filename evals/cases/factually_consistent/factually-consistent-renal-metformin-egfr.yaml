id: factually-consistent-renal-metformin-egfr
category: factually_consistent
failure_mode: >
  The cited guideline quote must actually support the monitoring-frequency
  claim -- a metformin/eGFR monitoring question must cite the real
  frequency, not a fabricated interval.
question: "How often should eGFR be checked in a patient on metformin?"
patient_id: 1
retrieved_chunks:
  - chunk_id: "renal-function-monitoring#metformin"
    doc_id: "renal-function-monitoring"
    title: "Renal Function Monitoring on Nephrotoxic-Risk Medications"
    section: "Metformin"
    text: >
      Metformin is renally cleared, and reduced kidney function raises the
      risk of drug accumulation and lactic acidosis. eGFR is generally
      checked at least annually in patients on metformin, more frequently if
      renal function is borderline or trending down, with dose adjustment or
      discontinuation considered at defined eGFR thresholds.
assertions:
  - type: verdict
    equals: verified
  - type: guideline_citation_present
xfail: >
  OBSERVED (recorded, qwen3:4b): despite no chart-data tool_data being
  provided for this patient (the question is guideline-only), the planner
  calls get_medications twice, finds an empty medication list, and answers
  that the question "does not apply" to this patient because she is not
  currently taking metformin -- never engaging with the retrieved
  eGFR-monitoring guideline chunk at all. The citations the extractor
  produces are real, correctly-grounded SourceRefs against that empty
  medication list, not fabrications -- but because the guideline chunk is
  never quoted or cited, the claim fails citation re-validation (verdict:
  blocked) even though a real, verbatim-quotable guideline chunk was
  available. This is an honest, reproducible P3G.1 finding about the local
  4B model's tendency to deflect a general guideline question onto
  irrelevant patient-specific data instead of answering from the retrieved
  evidence, not a harness bug -- the assertion (verdict: verified) is the
  correct target and is deliberately not weakened.
