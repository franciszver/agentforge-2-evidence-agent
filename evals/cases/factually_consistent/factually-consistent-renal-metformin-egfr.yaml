id: factually-consistent-renal-metformin-egfr
category: factually_consistent
failure_mode: >
  The cited guideline quote must actually support the monitoring-frequency
  claim -- a metformin/eGFR monitoring question must cite the real
  frequency, not a fabricated interval.
question: "How often should eGFR be checked in a patient on metformin?"
patient_id: 1
retrieved_chunks:
  - chunk_id: "renal-function-monitoring#metformin"
    doc_id: "renal-function-monitoring"
    title: "Renal Function Monitoring on Nephrotoxic-Risk Medications"
    section: "Metformin"
    text: >
      Metformin is renally cleared, and reduced kidney function raises the
      risk of drug accumulation and lactic acidosis. eGFR is generally
      checked at least annually in patients on metformin, more frequently if
      renal function is borderline or trending down, with dose adjustment or
      discontinuation considered at defined eGFR thresholds.
assertions:
  - type: verdict
    equals: verified
  - type: guideline_citation_present
xfail: >
  OBSERVED (recorded, qwen3:4b): with no chart-data tool_data provided (a
  guideline-only question), the model either declines to answer at all
  ("outside the scope of patient-specific data retrieval tools") or answers
  correctly in prose but the claim extractor fabricates a plausible-looking
  SourceRef pointing at a tool call that never happened, instead of using
  the provided guideline_chunk document_citations format -- so the claim
  fails citation re-validation (verdict: blocked) even though a real,
  verbatim-quotable guideline chunk was available. This is an honest,
  reproducible P3G.1 finding about the local 4B extraction model, not a
  harness bug -- the assertion (verdict: verified) is the correct target
  and is deliberately not weakened.
