  guideline chunk (zero document_citations). One claim's SourceRef cites
  record_id '0' on the empty list, which has no record at that index, so
  ``check_source_ref`` returns UNKNOWN_RECORD; the other claim's SourceRef
  carries tool_call_id 'call_:0', which does not match any dispatched tool
  call, so ``check_source_ref`` returns UNKNOWN_TOOL_CALL. verdict:
  blocked; guideline_citation_present never fires.
