id: factually-consistent-a1c-stricter-target
category: factually_consistent
failure_mode: >
  The cited guideline quote must actually support the claim it backs
  (verbatim match against the raw corpus chunk) -- a healthy-adult stricter
  A1c target question must not be answered with a paraphrase or invented
  number that the retrieved chunk never states.
question: "For a healthy adult with a long life expectancy, is a stricter A1c target below 6.5% reasonable?"
patient_id: 1
retrieved_chunks:
  - chunk_id: "a1c-targets#target-ranges"
    doc_id: "a1c-targets"
    title: "A1c Targets for Adults with Diabetes"
    section: "Target Ranges"
    text: |-
      - Most non-pregnant adults with diabetes: A1c target generally below 7%.
      - Healthy adults with a long life expectancy and low hypoglycemia risk: a
        stricter target, below 6.5%, may be reasonable if it can be reached safely.
      - Older adults, or those with limited life expectancy, significant
        comorbidity, or a history of severe hypoglycemia: a looser target, such as
        below 8% or 8.5%, is often more appropriate.
      - Pregnant patients with pre-existing or gestational diabetes have distinct,
        tighter glycemic targets that are outside the scope of this summary.
assertions:
  - type: verdict
    equals: verified
  - type: guideline_citation_present
xfail: >
  OBSERVED (recorded, qwen3:4b): the planner dispatches no tool calls for
  this turn. The model's answer asserts the patient has no diabetes and
  that A1c testing is not indicated in non-diabetic individuals -- a
  patient-specific premise not present in any tool_data for this case and
  not the question asked (whether a stricter A1c target is reasonable for
  a healthy adult). The extracted claims never cite the retrieved guideline
  chunk (zero document_citations); each carries a SourceRef with
  tool_call_id 'call_0', which does not match any dispatched tool call (the
  trace is empty), so ``check_source_ref`` returns UNKNOWN_TOOL_CALL.
  verdict: blocked; guideline_citation_present never fires.
