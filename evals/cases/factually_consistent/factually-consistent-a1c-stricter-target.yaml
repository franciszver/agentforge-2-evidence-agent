id: factually-consistent-a1c-stricter-target
category: factually_consistent
failure_mode: >
  The cited guideline quote must actually support the claim it backs
  (verbatim match against the raw corpus chunk) -- a healthy-adult stricter
  A1c target question must not be answered with a paraphrase or invented
  number that the retrieved chunk never states.
question: "For a healthy adult with a long life expectancy, is a stricter A1c target below 6.5% reasonable?"
patient_id: 1
retrieved_chunks:
  - chunk_id: "a1c-targets#target-ranges"
    doc_id: "a1c-targets"
    title: "A1c Targets for Adults with Diabetes"
    section: "Target Ranges"
    text: >
      Most non-pregnant adults with diabetes: A1c target generally below 7%.
      Healthy adults with a long life expectancy and low hypoglycemia risk: a
      stricter target, below 6.5%, may be reasonable if it can be reached
      safely. Older adults, or those with limited life expectancy, significant
      comorbidity, or a history of severe hypoglycemia: a looser target, such
      as below 8% or 8.5%, is often more appropriate.
assertions:
  - type: verdict
    equals: verified
  - type: guideline_citation_present
xfail: >
  OBSERVED (recorded, qwen3:4b): with no chart-data tool_data provided (a
  guideline-only question), the model either declines to answer at all
  ("outside the scope of patient-specific data retrieval tools") or answers
  correctly in prose but the claim extractor fabricates a plausible-looking
  SourceRef pointing at a tool call that never happened, instead of using
  the provided guideline_chunk document_citations format -- so the claim
  fails citation re-validation (verdict: blocked) even though a real,
  verbatim-quotable guideline chunk was available. This is an honest,
  reproducible P3G.1 finding about the local 4B extraction model, not a
  harness bug -- the assertion (verdict: verified) is the correct target
  and is deliberately not weakened.
