  mmHg, a value not present in any tool_data for this case. The extracted
  claims never cite the retrieved guideline chunk (zero document_citations);
  each carries a SourceRef with tool_call_id 'call_0', which does not match
  any dispatched tool call (the trace is empty), so ``check_source_ref``
  returns UNKNOWN_TOOL_CALL. verdict: blocked; guideline_citation_present
