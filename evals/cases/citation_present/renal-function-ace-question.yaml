id: renal-function-ace-question
category: citation_present
failure_mode: >
  P3G.1: a guideline-answerable chart question must yield an answer whose clinical claim
  carries a VERIFIED guideline_chunk DocumentCitation -- a real retrieved chunk, quoted
  verbatim -- alongside the chart-data citation.
question: "He just started lisinopril -- when should we recheck his kidney function?"
patient_id: 1
tool_data:
  get_medications:
    items:
      - name: "Lisinopril"
        dose: "10mg"
        route: "oral"
        status: "active"
retrieved_chunks:
  - chunk_id: "renal-function-monitoring#ace-inhibitors-and-arbs"
    doc_id: "renal-function-monitoring"
    title: "Renal Function Monitoring on Nephrotoxic-Risk Medications"
    section: "ACE Inhibitors and ARBs"
    text: |-
      A baseline creatinine/eGFR and potassium is typically checked before
      starting an ACE inhibitor or ARB, with a recheck at roughly 1-2 weeks after
      starting or up-titrating. A rise in creatinine up to about 30% from baseline
      is commonly considered an expected, acceptable hemodynamic effect rather
      than a reason to stop; a larger rise, or a significant potassium increase,
      generally prompts reassessment of the regimen. See `nsaid-interactions` for
      the added risk when an NSAID is also present.
    rerank_score: 0.9
assertions:
  - type: verdict
    equals: verified
  - type: guideline_citation_present
xfail: >
  OBSERVED (re-recorded #58, qwen3-8b-q5): a genuine near-miss, a DIFFERENT
  failure mode than this case showed under qwen3:4b. The model DOES surface
  a guideline_chunk DocumentCitation this time, quoting the ACE-inhibitor
  monitoring passage in a claim that survives citation re-validation --
  guideline_citation_present alone would pass here. But the overall verdict
  still fails to reach ``verified``: 1 of the 6 extracted claims (an
  unrelated chart-data claim) lacks a valid source ref and gets stripped
  ("Not found in record"), so the citation axis lands on SOME_VERIFIED and
  the verdict stays partially_verified. citation_present's actual assertion
  (a claim carrying a verified guideline_chunk citation) genuinely fires,
  but the case as a whole still doesn't meet the combined bar (``verdict
  equals verified`` AND ``guideline_citation_present``). An honest,
  reproducible P3G.1 finding, not a harness bug -- the assertions are the
  correct target and are deliberately not weakened.
