id: renal-function-ace-question
category: citation_present
failure_mode: >
  P3G.1: a guideline-answerable chart question must yield an answer whose clinical claim
  carries a VERIFIED guideline_chunk DocumentCitation -- a real retrieved chunk, quoted
  verbatim -- alongside the chart-data citation.
question: "He just started lisinopril -- when should we recheck his kidney function?"
patient_id: 1
tool_data:
  get_medications:
    items:
      - name: "Lisinopril"
        dose: "10mg"
        route: "oral"
        status: "active"
retrieved_chunks:
  - chunk_id: "renal-function-monitoring#ace-inhibitors-and-arbs"
    doc_id: "renal-function-monitoring"
    title: "Renal Function Monitoring on Nephrotoxic-Risk Medications"
    section: "ACE Inhibitors and ARBs"
    text: |-
      A baseline creatinine/eGFR and potassium is typically checked before
      starting an ACE inhibitor or ARB, with a recheck at roughly 1-2 weeks after
      starting or up-titrating. A rise in creatinine up to about 30% from baseline
      is commonly considered an expected, acceptable hemodynamic effect rather
      than a reason to stop; a larger rise, or a significant potassium increase,
      generally prompts reassessment of the regimen. See `nsaid-interactions` for
      the added risk when an NSAID is also present.
    rerank_score: 0.9
assertions:
  - type: verdict
    equals: verified
  - type: guideline_citation_present
xfail: >
  OBSERVED (re-recorded #81, qwen3-8b-q5, gate ON): this draw regressed
  further than the #58 near-miss it used to show -- every one of the 6
  extracted claims lacks a valid source ref and gets stripped ("Not found
  in record"), so the citation axis is NONE_VERIFIED and the verdict is
  fail-closed `blocked`. No claim ever surfaces or quotes the ACE-inhibitor
  monitoring guideline passage, so citation_present never fires either
  (zero document_citations) -- the semantic-support judge never runs
  (nothing to re-judge). This is a worse draw on the source-ref axis than
  #58's recording (which had a real, judge-eligible guideline citation and
  only 1 of 6 claims stripped), real run-to-run variance rather than a
  regression from the gate itself -- the gate never got a chance to act on
  this draw's answer at all. An honest, reproducible P3G.1 finding, not a
  harness bug -- the assertions are the correct target and are deliberately
  not weakened.
