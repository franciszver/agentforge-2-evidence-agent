id: metformin-renal-monitoring-question
category: citation_present
failure_mode: >
  P3G.1: a guideline-answerable chart question must yield an answer whose clinical claim
  carries a VERIFIED guideline_chunk DocumentCitation -- a real retrieved chunk, quoted
  verbatim -- alongside the chart-data citation.
question: "She's on metformin -- how often should her kidney function be checked?"
patient_id: 1
tool_data:
  get_medications:
    items:
      - name: "Metformin"
        dose: "500mg"
        route: "oral"
        status: "active"
retrieved_chunks:
  - chunk_id: "renal-function-monitoring#metformin"
    doc_id: "renal-function-monitoring"
    title: "Renal Function Monitoring on Nephrotoxic-Risk Medications"
    section: "Metformin"
    text: |-
      Metformin is renally cleared, and reduced kidney function raises the risk
      of drug accumulation and lactic acidosis. eGFR is generally checked at
      least annually in patients on metformin, more frequently if renal function
      is borderline or trending down, with dose adjustment or discontinuation
      considered at defined eGFR thresholds.
    rerank_score: 0.9
assertions:
  - type: verdict
    equals: verified
  - type: guideline_citation_present
xfail: >
  OBSERVED (re-recorded #58, qwen3-8b-q5): given BOTH real chart-data tool
  results and a retrieved guideline chunk for the same turn, the model
  answers only from the chart data and never surfaces or quotes the
  guideline passage in its final answer -- so the claim extractor produces
  zero guideline_chunk document citations, and citation_present never
  fires. Separately, the model also asserts several "no recorded X" claims
  (problems/allergies/labs/vitals/encounters/appointments) that don't all
  carry a valid source ref, so 2 of 9 extracted claims get stripped and the
  verdict stays partially_verified rather than verified -- a second,
  independent reason this case doesn't pass. Same chart-data-only pattern
  this case showed under qwen3:4b, just a different specific model. An
  honest, reproducible P3G.1 finding, not a harness bug -- the assertions
  are the correct target and are deliberately not weakened.
