id: metformin-renal-monitoring-question
category: citation_present
failure_mode: >
  P3G.1: a guideline-answerable chart question must yield an answer whose clinical claim
  carries a VERIFIED guideline_chunk DocumentCitation -- a real retrieved chunk, quoted
  verbatim -- alongside the chart-data citation.
question: "She's on metformin -- how often should her kidney function be checked?"
patient_id: 1
tool_data:
  get_medications:
    items:
      - name: "Metformin"
        dose: "500mg"
        route: "oral"
        status: "active"
retrieved_chunks:
  - chunk_id: "renal-function-monitoring#metformin"
    doc_id: "renal-function-monitoring"
    title: "Renal Function Monitoring on Nephrotoxic-Risk Medications"
    section: "Metformin"
    text: |-
      Metformin is renally cleared, and reduced kidney function raises the risk
      of drug accumulation and lactic acidosis. eGFR is generally checked at
      least annually in patients on metformin, more frequently if renal function
      is borderline or trending down, with dose adjustment or discontinuation
      considered at defined eGFR thresholds.
    rerank_score: 0.9
assertions:
  - type: verdict
    equals: verified
  - type: guideline_citation_present
xfail: >
  RE-OBSERVED (issue #118, live re-verification against current main, 10
  fresh draws through `evals.runner.pipeline.run_case`, production
  `LlamaServerClient`, no replay, WITH the issue #47/#81 semantic-support
  gate correctly applied this time): issue #116's characterization
  documented here previously -- "the claim extractor never attaches a real
  `DocumentCitation` for the guideline quote in any of the 10 draws" --
  does NOT reproduce. In all 10 fresh draws, the extractor reliably attaches
  a real, verbatim `guideline_chunk` DocumentCitation
  (`renal-function-monitoring#metformin`) to the two claims that need one,
  and both pass the semantic-support judge ("supported"). `guideline_
  citation_present` PASSES 10/10 -- this eval category's actual regression
  target for this case is met. (The extractor does still emit 1-3 duplicate
  copies of the unrelated chart-data medication-name `SourceRef` alongside
  the real DocumentCitation on the same claim -- harmless today, since the
  claim's `passed` status is grounded by the real citation regardless of
  those extra, redundant refs.)

  The case still does not reach `verified`, though -- for a THIRD, distinct
  mechanism, unrelated to both #116's finding and #118's hypothesis: the
  extractor reliably decomposes the answer into a 4th claim ("The exact
  frequency of kidney function checks should be determined based on the
  patient's individual health status...") that is a genuine over-
  generalization beyond what its cited guideline passage ("...dose
  adjustment or discontinuation considered at defined eGFR thresholds")
  actually supports -- and the semantic-support judge correctly flags it
  `not_supported`, 10/10 draws, stripping that one claim and dropping the
  overall verdict to `partially_verified`. This looks like the gate working
  as intended (catching a real over-claim), not a defect -- no fix is
  applied here for it. `evals/test_cases.py::test_case_replay` confirms:
  replaying the recording below fails exactly on `verdict` (expected
  `verified`, got `partially_verified`), never on `guideline_citation_
  present`.

  Issue #118's own premise (a duplicated, irrelevant SourceRef standing in
  for a missing guideline citation) is filed as a still-open, currently-
  unexercised design question in issue #130 (should `check_source_ref`/
  `check_claim` gain a relevance check on ordinary `SourceRef`s, analogous
  to the semantic-support gate) rather than fixed here, since no live-
  reproducible case currently needs it and forcing a broad, untuned
  relevance check risks false-rejecting genuinely-valid citations
  elsewhere in the suite. See `services/copilot-agent/tests/
  test_verification.py::test_source_ref_relevance_is_not_checked_
  structural_validity_only` for a characterization test of the accepted
  gap. This also corrects issue #109's own spike finding for this case
  (recorded as "clean guideline DocumentCitation, verified 3/3" in
  `docs/MODEL_AND_HARDWARE_SELECTION.md`'s issue #109 table), same as
  #116 already did -- see `docs/MODEL_AND_HARDWARE_SELECTION.md`, "Issue
  #118 follow-up" for the full data. An honest, reproducible P3G.1 finding
  -- the assertions are the correct target and are deliberately not
  weakened; `citation_present`'s total is unchanged at 4/12 (this case
  still does not reach a full pass -- `verdict` remains unmet -- so it is
  not un-xfailed).
