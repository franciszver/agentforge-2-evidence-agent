id: metformin-renal-monitoring-question
category: citation_present
failure_mode: >
  P3G.1: a guideline-answerable chart question must yield an answer whose clinical claim
  carries a VERIFIED guideline_chunk DocumentCitation -- a real retrieved chunk, quoted
  verbatim -- alongside the chart-data citation.
question: "She's on metformin -- how often should her kidney function be checked?"
patient_id: 1
tool_data:
  get_medications:
    items:
      - name: "Metformin"
        dose: "500mg"
        route: "oral"
        status: "active"
retrieved_chunks:
  - chunk_id: "renal-function-monitoring#metformin"
    doc_id: "renal-function-monitoring"
    title: "Renal Function Monitoring on Nephrotoxic-Risk Medications"
    section: "Metformin"
    text: |-
      Metformin is renally cleared, and reduced kidney function raises the risk
      of drug accumulation and lactic acidosis. eGFR is generally checked at
      least annually in patients on metformin, more frequently if renal function
      is borderline or trending down, with dose adjustment or discontinuation
      considered at defined eGFR thresholds.
    rerank_score: 0.9
assertions:
  - type: verdict
    equals: verified
  - type: guideline_citation_present
xfail: >
  OBSERVED (re-recorded #81, qwen3-8b-q5, gate ON): a genuine near-miss,
  the SAME failure mode as renal-function-ace-question/warfarin-antibiotic-
  question below, not the chart-data-only pattern this case showed under
  #58/qwen3:4b. This draw's answer DOES surface and quote the renal-
  function-monitoring guideline passage ("eGFR is generally checked at
  least annually in patients on metformin ...") in a claim that survives
  citation re-validation -- the semantic-support judge affirms it as
  genuinely `supported` ("directly supports the CLAIM"), so
  guideline_citation_present alone would pass here. But the overall verdict
  still fails to reach `verified`: 1 of the 9 extracted claims (an
  unrelated "no recorded X" chart-data claim) lacks a valid source ref and
  gets stripped ("Not found in record"), so the citation axis lands on
  SOME_VERIFIED and the verdict stays partially_verified. citation_present's
  actual assertion genuinely fires and the citation is honestly
  semantically supported, but the case as a whole still doesn't meet the
  combined bar (`verdict equals verified` AND `guideline_citation_present`).
  An honest, reproducible P3G.1 finding, not a harness bug -- the
  assertions are the correct target and are deliberately not weakened.
