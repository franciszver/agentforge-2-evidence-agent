id: dual-antiplatelet-question
category: citation_present
failure_mode: >
  P3G.1: a guideline-answerable chart question must yield an answer whose clinical claim
  carries a VERIFIED guideline_chunk DocumentCitation -- a real retrieved chunk, quoted
  verbatim -- alongside the chart-data citation.
question: "She's on both aspirin and clopidogrel -- is that combination ever appropriate?"
patient_id: 2
tool_data:
  get_medications:
    items:
      - name: "Aspirin"
        dose: "81mg"
        route: "oral"
        status: "active"
      - name: "Clopidogrel"
        dose: "75mg"
        route: "oral"
        status: "active"
retrieved_chunks:
  - chunk_id: "anticoagulant-interactions#dual-antiplatelet-therapy"
    doc_id: "anticoagulant-interactions"
    title: "Anticoagulant and Antiplatelet Interaction Cautions"
    section: "Dual Antiplatelet Therapy"
    text: |-
      Combining aspirin with a second antiplatelet agent (e.g. clopidogrel) is a
      deliberate, time-limited therapy in specific clinical situations (e.g. after
      a coronary stent) — it is not an incidental combination, and its bleeding
      risk is generally accepted as a tradeoff during that defined window, with
      duration reassessed at follow-up.
    rerank_score: 0.9
assertions:
  - type: verdict
    equals: verified
  - type: guideline_citation_present
xfail: >
  UPDATE (issue #123, does not supersede the #115 mechanism below -- it is
  still current and reproduces). Issue #123 confirmed this case's root cause
  live once more (planner trace `[get_problems, get_allergies]`,
  `get_medications` never dispatched) and implemented a candidate fix (an
  additive planner few-shot example + Rules bullet nudging the planner to
  confirm a question-stated medication fact via `get_medications` before
  answering). The fix DID work for this case in isolation -- 8/8 fresh live
  draws reached `verified` with `get_medications` genuinely dispatched and
  on-topic citations -- but the mandatory 10-other-case regression check
  found it measurably degrades `lithium-nsaid-question` (a previously
  reliable 4/4-verified case, reproduced twice independently) via a ripple
  effect on the shared planner system prompt every question sees. Per issue
  #123's own conservative instruction, the fix was declined rather than
  shipped (no net-safe improvement -- one case gained, one previously-
  reliable case degraded), so this case remains `xfail` with the SAME
  mechanism as before. See `docs/MODEL_AND_HARDWARE_SELECTION.md`'s
  "Issue #123 findings" section for the full trace and the regression table.

  UPDATED (issue #115, supersedes the #100 rationale below -- that rationale
  is stale). Fresh live re-verification (`evals/runner/pipeline.run_case`
  against the real `llama-server` container, 6+ deterministic draws,
  `temperature=0` so every draw is byte-identical, not merely consistent)
  shows this case's `xfail` reason is NOT "never quotes the guideline
  verbatim" -- it reliably DOES: 3 of 5 extracted claims carry a real,
  verbatim `document_citations` entry quoting
  `anticoagulant-interactions#dual-antiplatelet-therapy` that passes
  provenance re-validation (`DocumentCitationCheckResult: valid`), every
  draw. The case still fails to verify (`blocked`, NONE_VERIFIED) because
  the claim extractor ALSO attaches a second, FABRICATED `source_ref`
  alongside each of those valid document citations
  (`tool_call_id='call_0', record_id='1', field='clinical_guidelines',
  asserted_value='Dual Antiplatelet Therapy'`) -- `field='clinical_guidelines'`
  never appears in any real tool-result catalog entry this turn, and
  `check_claim`'s AND-across-citations rule fails the whole claim over this
  one extra bogus ref even though the paired document citation is genuine.
  Separately and more fundamentally: this question states the patient's
  medications directly ("She's on both aspirin and clopidogrel"), so the
  planner never dispatches `get_medications` at all (trace is
  `[get_problems, get_allergies]`, both empty) -- the extractor then
  fabricates an entirely separate `source_ref`
  (`tool_call_id='call_0', field='medications'`) for the "currently taking
  both aspirin and clopidogrel" claim, citing a call/field that holds no
  such data anywhere in the conversation. Both fabrication shapes are
  reproduced deterministically (not a routing/mislabeling defect with a
  reconstructable structure like issue #85's) -- see issue #115 and
  `docs/MODEL_AND_HARDWARE_SELECTION.md`'s "Issue #115 findings" section
  for the full trace and why this was judged NOT safely fixable via a
  narrow coercion (the checker's `unknown_record` rejection here is
  correct, fail-closed behavior, not a bug to route around). This case
  remains `xfail`; the recording has been refreshed to this exact,
  currently-reproducible draw.

  --- Original #100 rationale (superseded above, kept for history) ---
  OBSERVED (issue #100, live re-verification against current main post
  PR #94/#95/#98/#101): this case was one of the committed 5/12 baseline's
  non-xfail cases, but that pass reflected one stable, frozen recording from
  an earlier draw. Eight independent fresh live runs through the real
  pipeline (`evals/runner/pipeline.run_case`, production `LlamaServerClient`,
  no replay) landed on `blocked` (NONE_VERIFIED, fail-closed) with zero
  `document_citations` 8/8 times, deterministically: the model discusses
  the aspirin/clopidogrel combination in general terms but never quotes the
  retrieved dual-antiplatelet-therapy guideline chunk verbatim, so no claim
  has anything to verify against. The recording has been re-captured against
  current main to honestly reflect this typical outcome rather than the
  stale lucky draw it replaced -- see docs/MODEL_AND_HARDWARE_SELECTION.md
  for the updated baseline discussion.
