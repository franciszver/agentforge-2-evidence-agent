id: dual-antiplatelet-question
category: citation_present
failure_mode: >
  P3G.1: a guideline-answerable chart question must yield an answer whose clinical claim
  carries a VERIFIED guideline_chunk DocumentCitation -- a real retrieved chunk, quoted
  verbatim -- alongside the chart-data citation.
question: "She's on both aspirin and clopidogrel -- is that combination ever appropriate?"
patient_id: 2
tool_data:
  get_medications:
    items:
      - name: "Aspirin"
        dose: "81mg"
        route: "oral"
        status: "active"
      - name: "Clopidogrel"
        dose: "75mg"
        route: "oral"
        status: "active"
retrieved_chunks:
  - chunk_id: "anticoagulant-interactions#dual-antiplatelet-therapy"
    doc_id: "anticoagulant-interactions"
    title: "Anticoagulant and Antiplatelet Interaction Cautions"
    section: "Dual Antiplatelet Therapy"
    text: |-
      Combining aspirin with a second antiplatelet agent (e.g. clopidogrel) is a
      deliberate, time-limited therapy in specific clinical situations (e.g. after
      a coronary stent) — it is not an incidental combination, and its bleeding
      risk is generally accepted as a tradeoff during that defined window, with
      duration reassessed at follow-up.
    rerank_score: 0.9
assertions:
  - type: verdict
    equals: verified
  - type: guideline_citation_present
xfail: >
  OBSERVED (recorded, qwen3:4b): given BOTH real chart-data tool results
  and a retrieved guideline chunk for the same turn, the model consistently
  answers only from the chart data and never surfaces or quotes the
  guideline passage in its final answer -- so the claim extractor has no
  guideline text to cite and produces zero guideline_chunk document
  citations (verdict stays verified/partially_verified on the chart-data
  claims alone, but citation_present -- a claim carrying a VERIFIED
  guideline_chunk citation -- never fires). This is an honest, reproducible
  P3G.1 finding about the local 4B model's current tendency to prioritize
  structured chart data over retrieved guideline evidence when both are
  available in one turn, not a harness bug -- the assertions are the
  correct target and are deliberately not weakened.
