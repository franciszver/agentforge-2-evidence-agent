id: warfarin-antibiotic-question
category: citation_present
failure_mode: >
  P3G.1: a guideline-answerable chart question must yield an answer whose clinical claim
  carries a VERIFIED guideline_chunk DocumentCitation -- a real retrieved chunk, quoted
  verbatim -- alongside the chart-data citation.
question: "She's starting an antibiotic for a UTI -- any interaction concern with her warfarin?"
patient_id: 2
tool_data:
  get_medications:
    items:
      - name: "Warfarin"
        dose: "5mg"
        route: "oral"
        status: "active"
retrieved_chunks:
  - chunk_id: "anticoagulant-interactions#warfarin-specific-cautions"
    doc_id: "anticoagulant-interactions"
    title: "Anticoagulant and Antiplatelet Interaction Cautions"
    section: "Warfarin-Specific Cautions"
    text: |-
      Warfarin's effect is sensitive to many interacting drugs and to vitamin K
      intake. Common interaction cautions include: NSAIDs and other antiplatelet
      agents (see `nsaid-interactions`), certain antibiotics (e.g. some
      fluoroquinolones, metronidazole, trimethoprim-sulfamethoxazole) which can
      potentiate warfarin's effect, and amiodarone, which can meaningfully raise
      INR. Any new interacting medication started alongside warfarin generally
      warrants closer INR monitoring for a period after the change.
    rerank_score: 0.9
assertions:
  - type: verdict
    equals: verified
  - type: guideline_citation_present
# Eval-integrity fix (see git history): this case was previously marked as a
# genuine PASS on the strength of a DOCTORED retrieved_chunks fixture -- its
# `text` was a paraphrase/compression of the real corpus section
# (services/copilot-agent/corpus/anticoagulant-interactions.md
# #warfarin-specific-cautions) that dropped the "Warfarin's effect is
# sensitive to many interacting drugs and to vitamin K intake." lead-in and
# the "...and amiodarone, which can meaningfully raise INR." clause. The
# fixture above is now the REAL, complete corpus section text; see the
# xfail reason below for the honest result against it.
xfail: >
  OBSERVED (re-recorded #81, qwen3-8b-q5, gate ON) against the real,
  complete guideline chunk: this draw regressed further than the #58
  near-miss it used to show -- the answer stays on chart data (Warfarin
  name/dose) and a generic interaction warning, but never surfaces or
  quotes the warfarin-specific-cautions guideline passage at all, so the
  claim extractor produces zero guideline_chunk document citations and
  citation_present never fires (the semantic-support judge never runs --
  nothing to re-judge). Separately, 2 of the 4 extracted claims (the
  interaction-warning claims) lack a valid source ref and get stripped
  ("Not found in record"), so the verdict lands on partially_verified
  rather than verified -- a second, independent reason this case doesn't
  pass. This is a worse draw on the citation-retrieval axis than #58's
  recording (which had two real, judge-eligible guideline citations), real
  run-to-run variance rather than a regression from the gate itself -- the
  gate never got a chance to act on this draw's answer at all. An honest,
  reproducible P3G.1 finding, not a harness bug -- the assertions are the
  correct target and are deliberately not weakened.
