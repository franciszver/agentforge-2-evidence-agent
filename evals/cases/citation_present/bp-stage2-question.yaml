id: bp-stage2-question
category: citation_present
failure_mode: >
  P3G.1: a guideline-answerable chart question must yield an answer whose clinical claim
  carries a VERIFIED guideline_chunk DocumentCitation -- a real retrieved chunk, quoted
  verbatim -- alongside the chart-data citation.
question: "What was his last blood pressure reading, and what category does that fall into?"
patient_id: 1
tool_data:
  get_vitals:
    items:
      - vital_type: "blood_pressure_systolic"
        value: 148
        unit: "mmHg"
        date: "2026-06-01T09:00:00"
      - vital_type: "blood_pressure_diastolic"
        value: 94
        unit: "mmHg"
        date: "2026-06-01T09:00:00"
retrieved_chunks:
  - chunk_id: "blood-pressure-categories#categories"
    doc_id: "blood-pressure-categories"
    title: "Blood Pressure Categories and Thresholds"
    section: "Categories"
    text: |-
      - Normal: systolic below 120 mmHg AND diastolic below 80 mmHg.
      - Elevated: systolic 120-129 mmHg AND diastolic below 80 mmHg.
      - Stage 1 hypertension: systolic 130-139 mmHg OR diastolic 80-89 mmHg.
      - Stage 2 hypertension: systolic 140 mmHg or higher OR diastolic 90 mmHg or
        higher.
      - Hypertensive crisis: systolic higher than 180 mmHg AND/OR diastolic higher
        than 120 mmHg — this requires prompt clinical attention, especially if
        accompanied by symptoms such as chest pain, shortness of breath, or
        neurologic changes.
    rerank_score: 0.9
assertions:
  - type: verdict
    equals: verified
  - type: guideline_citation_present
xfail: >
  OBSERVED (issue #85, live re-verification against current main post the
  #85 claim-extraction fix): the recording has been re-captured again --
  the extraction bug issue #100 originally attributed this case's failure
  to (the model never surfacing the guideline chunk at all) is fixed as of
  issue #85: the extraction step now correctly reclassifies the model's
  guideline citation (previously misrouted into `source_refs` with
  `tool_call_id="blood-pressure-categories"`, `record_id="categories"`,
  failing `unknown_tool_call`) into a real `document_citations` entry that
  passes provenance re-validation (`check_document_citation` returns
  `valid` -- the quoted "Stage 2 hypertension: systolic 140 mmHg or higher
  OR diastolic 90 mmHg or higher." text is a real, verbatim substring of
  the retrieved chunk). This case still does not verify, for a DIFFERENT,
  newly-visible reason: the semantic-support judge downgrades that same
  citation to `not_semantically_supported`, reasoning "The QUOTE defines
  Stage 2 hypertension but does not provide specific blood pressure
  readings from the CLAIM's context, so it does not directly support the
  assertion that 'this reading falls into the category of elevated blood
  pressure.'" -- a claim/citation category-name mismatch (the model's own
  final-answer text calls 148/94 mmHg "elevated blood pressure" rather than
  "Stage 2 hypertension", the category the retrieved guideline's own
  thresholds actually put it in). Current outcome on this recording:
  verdict `partially_verified`, the BP-value claim renders as a verified
  claim, and the category claim renders as a stripped `Notice` (no
  surviving `document_citations`). See issue #85's PR description for the
  full mechanism and why fixing the category-name mismatch is a separate,
  out-of-scope follow-up (planner answer composition, not claim/citation
  assembly).
