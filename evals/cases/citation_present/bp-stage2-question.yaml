  again -- the category-name mismatch issue #85 diagnosed (the planner's
  own final-answer text called 148/94 mmHg "elevated blood pressure" while
  the guideline it cited categorizes that reading as "Stage 2
  hypertension") is FIXED as of issue #105: guideline-corpus retrieval now
  runs before the planner composes its answer, and the retrieved text is
