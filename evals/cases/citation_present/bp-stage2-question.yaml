id: bp-stage2-question
category: citation_present
failure_mode: >
  P3G.1: a guideline-answerable chart question must yield an answer whose clinical claim
  carries a VERIFIED guideline_chunk DocumentCitation -- a real retrieved chunk, quoted
  verbatim -- alongside the chart-data citation.
question: "What was his last blood pressure reading, and what category does that fall into?"
patient_id: 1
tool_data:
  get_vitals:
    items:
      - vital_type: "blood_pressure_systolic"
        value: 148
        unit: "mmHg"
        date: "2026-06-01T09:00:00"
      - vital_type: "blood_pressure_diastolic"
        value: 94
        unit: "mmHg"
        date: "2026-06-01T09:00:00"
retrieved_chunks:
  - chunk_id: "blood-pressure-categories#categories"
    doc_id: "blood-pressure-categories"
    title: "Blood Pressure Categories and Thresholds"
    section: "Categories"
    text: |-
      - Normal: systolic below 120 mmHg AND diastolic below 80 mmHg.
      - Elevated: systolic 120-129 mmHg AND diastolic below 80 mmHg.
      - Stage 1 hypertension: systolic 130-139 mmHg OR diastolic 80-89 mmHg.
      - Stage 2 hypertension: systolic 140 mmHg or higher OR diastolic 90 mmHg or
        higher.
      - Hypertensive crisis: systolic higher than 180 mmHg AND/OR diastolic higher
        than 120 mmHg — this requires prompt clinical attention, especially if
        accompanied by symptoms such as chest pain, shortness of breath, or
        neurologic changes.
    rerank_score: 0.9
assertions:
  - type: verdict
    equals: verified
  - type: guideline_citation_present
xfail: >
