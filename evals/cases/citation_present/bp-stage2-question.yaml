id: bp-stage2-question
category: citation_present
failure_mode: >
  P3G.1: a guideline-answerable chart question must yield an answer whose clinical claim
  carries a VERIFIED guideline_chunk DocumentCitation -- a real retrieved chunk, quoted
  verbatim -- alongside the chart-data citation.
question: "What was his last blood pressure reading, and what category does that fall into?"
patient_id: 1
tool_data:
  get_vitals:
    items:
      - vital_type: "blood_pressure_systolic"
        value: 148
        unit: "mmHg"
        date: "2026-06-01T09:00:00"
      - vital_type: "blood_pressure_diastolic"
        value: 94
        unit: "mmHg"
        date: "2026-06-01T09:00:00"
retrieved_chunks:
  - chunk_id: "blood-pressure-categories#categories"
    doc_id: "blood-pressure-categories"
    title: "Blood Pressure Categories and Thresholds"
    section: "Categories"
    text: |-
      - Normal: systolic below 120 mmHg AND diastolic below 80 mmHg.
      - Elevated: systolic 120-129 mmHg AND diastolic below 80 mmHg.
      - Stage 1 hypertension: systolic 130-139 mmHg OR diastolic 80-89 mmHg.
      - Stage 2 hypertension: systolic 140 mmHg or higher OR diastolic 90 mmHg or
        higher.
      - Hypertensive crisis: systolic higher than 180 mmHg AND/OR diastolic higher
        than 120 mmHg — this requires prompt clinical attention, especially if
        accompanied by symptoms such as chest pain, shortness of breath, or
        neurologic changes.
    rerank_score: 0.9
assertions:
  - type: verdict
    equals: verified
  - type: guideline_citation_present
xfail: >
  OBSERVED (issue #100, live re-verification against current main post
  PR #94/#95/#98/#101): this case was one of the committed 5/12 baseline's
  non-xfail cases, but that pass reflected one stable, frozen recording from
  an earlier draw -- it was never re-checked against a FRESH live draw. Ten
  independent fresh live runs through the real pipeline
  (`evals/runner/pipeline.run_case`, production `LlamaServerClient`, no
  replay) landed on `partially_verified` with zero `document_citations`
  10/10 times, deterministically: the model answers only from the
  `get_vitals` chart data (148/94 mmHg, correctly categorized as elevated)
  and never surfaces or quotes the retrieved blood-pressure-categories
  guideline chunk in its final answer -- the same chart-data-only pattern
  already documented for several sibling xfail'd cases in this category
  (see e.g. `lipid-panel-ldl-question`). The recording has been re-captured
  against current main to honestly reflect this typical outcome rather than
  the stale lucky draw it replaced -- see docs/MODEL_AND_HARDWARE_SELECTION.md
  for the updated baseline discussion.
