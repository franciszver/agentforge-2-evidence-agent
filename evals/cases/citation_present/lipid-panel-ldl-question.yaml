id: lipid-panel-ldl-question
category: citation_present
failure_mode: >
  P3G.1: a guideline-answerable chart question must yield an answer whose clinical claim
  carries a VERIFIED guideline_chunk DocumentCitation -- a real retrieved chunk, quoted
  verbatim -- alongside the chart-data citation.
question: "What was her LDL cholesterol, and is that considered high?"
patient_id: 1
tool_data:
  get_recent_labs:
    items:
      - test_name: "LDL Cholesterol"
        value: "172"
        unit: "mg/dL"
        date: "2026-06-01T09:00:00"
        abnormal_flag: "high"
retrieved_chunks:
  - chunk_id: "lipid-panel-reference#general-reference-categories"
    doc_id: "lipid-panel-reference"
    title: "Lipid Panel Reference Ranges and Follow-Up"
    section: "General Reference Categories"
    text: >
      LDL cholesterol: optimal below 100 mg/dL; near-optimal 100-129 mg/dL; borderline-
      high 130-159 mg/dL; high 160-189 mg/dL; very high 190 mg/dL or above.
    rerank_score: 0.9
assertions:
  - type: verdict
    equals: verified
  - type: guideline_citation_present
xfail: >
  OBSERVED (recorded, qwen3:4b, pre-P3G.1b): given BOTH real chart-data tool
  results and a retrieved guideline chunk for the same turn, the model DID
  attempt to surface the guideline passage -- the claim extractor emitted a
  document_citations entry quoting the LDL reference-range chunk, but the
  quoted text dropped the single space after the line-folded "borderline-"
  hyphen ("borderline-high" vs. the chunk's actual "borderline- high"), so
  the (then whitespace-sensitive) verbatim substring check failed
  (QUOTE_NOT_FOUND). P3G.1b fixed that whitespace-sensitivity in
  ``check_document_citation`` (proven by
  ``tests/test_verification_documents.py``'s dedicated regression tests for
  this exact near-miss) and iterated the extraction-prompt guideline
  instructions -- but a REAL re-recording against qwen3:4b post-fix shows a
  DIFFERENT current failure mode for this case: the model no longer attempts
  a guideline citation for this claim AT ALL (zero document_citations),
  reverting to the more common "answers only from chart data" pattern seen
  on most other citation_present cases. citation_present still never fires
  (verdict stays verified/partially_verified on the chart-data claims
  alone). This is an honest, reproducible P3G.1 finding about the local 4B
  model's inherent run-to-run variability alongside its general tendency to
  prioritize structured chart data over retrieved guideline evidence, not a
  harness bug -- the assertions are the correct target and are deliberately
  not weakened.
