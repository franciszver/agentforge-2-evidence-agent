id: lipid-panel-ldl-question
category: citation_present
failure_mode: >
  P3G.1: a guideline-answerable chart question must yield an answer whose clinical claim
  carries a VERIFIED guideline_chunk DocumentCitation -- a real retrieved chunk, quoted
  verbatim -- alongside the chart-data citation.
question: "What was her LDL cholesterol, and is that considered high?"
patient_id: 1
tool_data:
  get_recent_labs:
    items:
      - test_name: "LDL Cholesterol"
        value: "172"
        unit: "mg/dL"
        date: "2026-06-01T09:00:00"
        abnormal_flag: "high"
retrieved_chunks:
  - chunk_id: "lipid-panel-reference#general-reference-categories"
    doc_id: "lipid-panel-reference"
    title: "Lipid Panel Reference Ranges and Follow-Up"
    section: "General Reference Categories"
    text: |-
      - Total cholesterol: desirable below 200 mg/dL; borderline-high 200-239
        mg/dL; high 240 mg/dL or above.
      - LDL cholesterol: optimal below 100 mg/dL; near-optimal 100-129 mg/dL;
        borderline-high 130-159 mg/dL; high 160-189 mg/dL; very high 190 mg/dL or
        above.
      - HDL cholesterol: low (higher risk) below 40 mg/dL in men or below 50
        mg/dL in women; higher HDL is generally considered protective.
      - Triglycerides: normal below 150 mg/dL; borderline-high 150-199 mg/dL;
        high 200-499 mg/dL; very high 500 mg/dL or above.
    rerank_score: 0.9
assertions:
  - type: verdict
    equals: verified
  - type: guideline_citation_present
xfail: >
  OBSERVED (re-recorded #125, qwen3-8b via llama-server): issue #125 fixed
  the SourceRef-misrouting defect this case's PRIOR xfail rationale (#113)
  described -- _coerce_misrouted_guideline_refs (app/extraction.py) now also
  recognizes the doc_id-used-twice shape (tool_call_id="lipid-panel-reference",
  record_id="lipid-panel-reference", no section slug) and reconstructs the
  real chunk id ("lipid-panel-reference#general-reference-categories")
  whenever it identifies exactly one retrieved chunk's doc_id unambiguously.
  Live re-verification (18 fresh draws total -- 10 full evals.runner.pipeline.
  run_case draws + 8 isolated extraction/provenance-focused draws, production
  LlamaServerClient, no replay, extraction/judge calls at temperature=0 and
  byte-identical every draw) confirms the fix: 18/18 draws now produce a real,
  verbatim guideline_chunk DocumentCitation that passes check_document_citation
  (CitationStatus.VALID) -- the #125 defect no longer blocks this case.
  However, the case STILL does not reach verified -- a separate, newly
  discovered defect in app.semantic_support's post-provenance judge gate
  (issue #47/#81) now blocks it instead, filed as issue #128. The claim
  extractor splits the answer into two claims ("...LDL cholesterol level is
  172 mg/dL" citing the chart value, and "...is considered high" citing the
  guideline categories chunk) -- apply_semantic_support judges the SECOND
  claim's citation in isolation, without the first claim's "172 mg/dL" value,
  so the judge (reasonably, given only what it's shown) downgrades it to
  NOT_SEMANTICALLY_SUPPORTED every time (8/8), with the live-captured reason:
  "The QUOTE provides LDL cholesterol categories but does not specify the
  patient's LDL level, so it does not support the claim that the patient's
  LDL cholesterol level is considered high." End to end, all 10 full-pipeline
  draws land on partially_verified, 0/10 verified. Issue #128 is filed for
  this new judge-input-scoping defect (out of #125's own scope). This case
  does not qualify to un-xfail; citation_present remains 4/12. The assertions
  are the correct target and are deliberately not weakened.
