id: lipid-panel-ldl-question
category: citation_present
failure_mode: >
  P3G.1: a guideline-answerable chart question must yield an answer whose clinical claim
  carries a VERIFIED guideline_chunk DocumentCitation -- a real retrieved chunk, quoted
  verbatim -- alongside the chart-data citation.
question: "What was her LDL cholesterol, and is that considered high?"
patient_id: 1
tool_data:
  get_recent_labs:
    items:
      - test_name: "LDL Cholesterol"
        value: "172"
        unit: "mg/dL"
        date: "2026-06-01T09:00:00"
        abnormal_flag: "high"
retrieved_chunks:
  - chunk_id: "lipid-panel-reference#general-reference-categories"
    doc_id: "lipid-panel-reference"
    title: "Lipid Panel Reference Ranges and Follow-Up"
    section: "General Reference Categories"
    text: |-
      - Total cholesterol: desirable below 200 mg/dL; borderline-high 200-239
        mg/dL; high 240 mg/dL or above.
      - LDL cholesterol: optimal below 100 mg/dL; near-optimal 100-129 mg/dL;
        borderline-high 130-159 mg/dL; high 160-189 mg/dL; very high 190 mg/dL or
        above.
      - HDL cholesterol: low (higher risk) below 40 mg/dL in men or below 50
        mg/dL in women; higher HDL is generally considered protective.
      - Triglycerides: normal below 150 mg/dL; borderline-high 150-199 mg/dL;
        high 200-499 mg/dL; very high 500 mg/dL or above.
    rerank_score: 0.9
assertions:
  - type: verdict
    equals: verified
  - type: guideline_citation_present
xfail: >
  OBSERVED (re-recorded #113, qwen3-8b via llama-server): the prior
  "chart-data-only" rationale (re-recorded #58) is STALE -- it does not
  reproduce. Fresh live re-verification (10 draws, evals.runner.pipeline.
  run_case, production LlamaServerClient, no replay; extraction is
  temperature=0 and every draw was byte-identical) shows the model DOES
  surface and quote the LDL reference-range guideline passage verbatim in
  its final answer every time ("...according to the clinical guideline").
  The claim extractor also attempts a citation for it every time -- but
  misroutes it as a source_ref (tool_call_id="lipid-panel-reference",
  record_id="lipid-panel-reference", field="text") instead of emitting a
  proper document_citations entry. This is a NEW variant of the #85-lineage
  SourceRef-misrouting defect: #85's existing coercion
  (_coerce_misrouted_guideline_refs in app/extraction.py) only reconstructs
  a chunk id from tool_call_id="<doc_id>" + record_id="<section-slug>", but
  here the model puts the doc_id in BOTH fields (no section slug), so the
  reconstructed id ("lipid-panel-reference#lipid-panel-reference") never
  matches the real chunk id
  ("lipid-panel-reference#general-reference-categories") and the ref is
  correctly left failing UNKNOWN_TOOL_CALL. check_claim's AND-aggregation
  then fails the whole "considered high" claim despite the guideline quote
  being genuine and verbatim (not fabricated, unlike #115's finding for
  other cases) -- so citation_present never fires, 10/10 draws
  partially_verified. Filed as a new tracked defect, issue #125, rather
  than fixed here -- issue #113 itself is scoped to the relevance-floor
  question, and this extraction-layer coercion gap is a distinct concern
  from that. citation_present remains 3/12; this case does not qualify to
  un-xfail. The assertions are the correct target and are deliberately not
  weakened.
