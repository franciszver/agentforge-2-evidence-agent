id: hypertension-lifestyle-followup-question
category: citation_present
failure_mode: >
  P3G.1: a guideline-answerable chart question must yield an answer whose clinical claim
  carries a VERIFIED guideline_chunk DocumentCitation -- a real retrieved chunk, quoted
  verbatim -- alongside the chart-data citation.
question: "His blood pressure was elevated at his last visit and we're trying lifestyle changes -- when should we have him back?"
patient_id: 1
tool_data:
  get_vitals:
    items:
      - vital_type: "blood_pressure_systolic"
        value: 132
        unit: "mmHg"
        date: "2026-06-01T09:00:00"
      - vital_type: "blood_pressure_diastolic"
        value: 84
        unit: "mmHg"
        date: "2026-06-01T09:00:00"
retrieved_chunks:
  - chunk_id: "hypertension-lifestyle#follow-up-cadence"
    doc_id: "hypertension-lifestyle"
    title: "Hypertension Lifestyle Management and Follow-Up"
    section: "Follow-Up Cadence"
    text: |-
      - Elevated blood pressure or Stage 1 hypertension managed with lifestyle
        alone: recheck at roughly 3-6 months to assess response before deciding
        whether to add pharmacotherapy.
      - Once on stable antihypertensive therapy at target: routine follow-up
        roughly every 3-6 months is a commonly cited cadence, more frequent if
        therapy was recently changed or control is not yet at target.
    rerank_score: 0.9
assertions:
  - type: verdict
    equals: verified
  - type: guideline_citation_present
xfail: >
  OBSERVED (re-recorded #81, qwen3-8b-q5, gate ON): this draw's planner
  never reaches an "answer" decision -- it spends all 6 allotted turns
  calling tools (appointments, encounters, medications, labs, problems,
  patient summary) and exhausts its turn budget, so ``Planner.run`` falls
  back to its own "wasn't able to reach a final answer" text. The claim
  extractor only has that fallback text plus the tool catalog to work with;
  it extracts 11 trivial "no X recorded" chart-data claims (all pass source-
  ref re-validation, so verdict happens to compute as verified) but never
  engages with the actual question or the retrieved guideline chunk at all
  -- zero document_citations, citation_present never fires, and the
  semantic-support judge never runs (nothing to re-judge). This case's PRIOR
  recording, pre-#81, reached a real final answer with a guideline citation
  -- real run-to-run variance (a different tool-call-budget outcome this
  draw), not a regression from the gate itself. An honest, reproducible
  P3G.1 finding, not a harness bug -- the assertions are the correct target
  and are deliberately not weakened.
