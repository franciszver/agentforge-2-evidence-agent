id: statin-ck-myopathy-question
category: citation_present
failure_mode: >
  P3G.1: a guideline-answerable chart question must yield an answer whose clinical claim
  carries a VERIFIED guideline_chunk DocumentCitation -- a real retrieved chunk, quoted
  verbatim -- alongside the chart-data citation.
question: "He's on a statin and feels fine -- does he need a routine CK level checked?"
patient_id: 1
tool_data:
  get_medications:
    items:
      - name: "Simvastatin"
        dose: "40mg"
        route: "oral"
        status: "active"
retrieved_chunks:
  - chunk_id: "statin-monitoring#muscle-symptoms-and-ck"
    doc_id: "statin-monitoring"
    title: "Statin Therapy Monitoring"
    section: "Muscle Symptoms and CK"
    text: |-
      Statins carry a known risk of myopathy. Routine creatine kinase (CK)
      monitoring in an asymptomatic patient is generally not recommended; a CK
      level is checked if the patient reports new muscle pain, tenderness, or
      weakness. Persistent, unexplained muscle symptoms with a significantly
      elevated CK generally warrant holding the statin and reassessing.
    rerank_score: 0.9
assertions:
  - type: verdict
    equals: verified
  - type: guideline_citation_present
