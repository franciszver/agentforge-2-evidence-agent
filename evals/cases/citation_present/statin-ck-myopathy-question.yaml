xfail: >
  RE-OBSERVED (issue #106, live re-verification against current main,
  qwen3-8b-q5 / llama_server engine): re-recorded 4/4 times via
  `evals/runner/record.py` (production `LlamaServerClient`, no replay).
  The `#85` citation-routing bug does not apply -- the model never attempts
