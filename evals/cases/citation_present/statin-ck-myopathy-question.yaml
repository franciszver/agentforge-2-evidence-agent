# engine"), which `app.extraction.ClaimExtractor.extract_claims`'s except
# clause already catches -- confirmed live, 4/4 fresh draws via
# `evals/runner/record.py` against the real llama_server-engine qwen3-8b-q5
# stack completed and recorded cleanly, no uncaught exception. This case is
# now re-recorded against the CURRENT model/engine (qwen3-8b-q5,
# llama_server) below, replacing the stale qwen3:4b-era recording #58 left
# in place. Original blocker, kept for history: under the llama_server
# engine, the model's claim extraction call for this turn used to
# deterministically emit a claim with an empty `source_refs` list ("There
# are no recent lab results available for CK levels."), which failed
# VerifiedAnswer's "every claim needs >=1 SourceRef or DocumentCitation"
# validator both retry attempts (temperature=0, byte-identical output each
# time) -- `LlamaServerClient.extract` then raised `LlamaServerError` after
