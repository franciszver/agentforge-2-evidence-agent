id: statin-ck-myopathy-question
category: citation_present
failure_mode: >
  P3G.1: a guideline-answerable chart question must yield an answer whose clinical claim
  carries a VERIFIED guideline_chunk DocumentCitation -- a real retrieved chunk, quoted
  verbatim -- alongside the chart-data citation.
question: "He's on a statin and feels fine -- does he need a routine CK level checked?"
patient_id: 1
tool_data:
  get_medications:
    items:
      - name: "Simvastatin"
        dose: "40mg"
        route: "oral"
        status: "active"
retrieved_chunks:
  - chunk_id: "statin-monitoring#muscle-symptoms-and-ck"
    doc_id: "statin-monitoring"
    title: "Statin Therapy Monitoring"
    section: "Muscle Symptoms and CK"
    text: |-
      Statins carry a known risk of myopathy. Routine creatine kinase (CK)
      monitoring in an asymptomatic patient is generally not recommended; a CK
      level is checked if the patient reports new muscle pain, tenderness, or
      weakness. Persistent, unexplained muscle symptoms with a significantly
      elevated CK generally warrant holding the statin and reassessing.
    rerank_score: 0.9
assertions:
  - type: verdict
    equals: verified
  - type: guideline_citation_present
# RESOLVED (issue #106 spot-check): #58's blocker below no longer applies.
# `app.llama_server_client.LlamaServerError` now extends `LLMEngineError`
# (see 2483e3b "extract_claims must degrade to [] under llama_server
# engine"), which `app.extraction.ClaimExtractor.extract_claims`'s except
# clause already catches -- confirmed live, 4/4 fresh draws via
# `evals/runner/record.py` against the real llama_server-engine qwen3-8b-q5
# stack completed and recorded cleanly, no uncaught exception. Original
# blocker, kept for history: under the llama_server engine, the model's
# claim extraction call for this turn used to deterministically emit a
# claim with an empty `source_refs` list ("There are no recent lab results
# available for CK levels."), which failed VerifiedAnswer's "every claim
# needs >=1 SourceRef or DocumentCitation" validator both retry attempts
# (temperature=0, byte-identical output each time) -- `LlamaServerClient
# .extract` then raised `LlamaServerError` after exhausting retries, and
# since it wasn't an `OllamaError` subclass at the time, it propagated
# uncaught and no recording could be produced at all.
#
# RE-OBSERVED then RESOLVED (issue #106, then issue #114): #106's 4/4 live
# re-draws found the model never attempted a guideline citation of any
# shape here -- given both real chart-data tool results and a retrieved
# guideline chunk in one turn, it answered only from the chart data. Issue
# #109 flagged this case again as one where the model "sometimes ignores
# evidence directly in front of it," and issue #114 asked for a larger
# live sample to confirm the rate precisely and, if it was a genuine
# prompting gap, a narrowly-scoped fix.
#
# Issue #114's live re-verification found the opposite of what a
# small sample suggested: across THREE separate live batches (10 + 10 + 5
# = 25 draws total, production `LlamaServerClient`, `evals.runner.pipeline
# .run_case`, no replay), the case reached `verified` with a real,
# verbatim `statin-monitoring` `guideline_chunk` `DocumentCitation` on
# 23/25 draws (92%) -- already highly reliable against CURRENT `main`,
# with NO prompting or extraction-code change. The 2 non-passing draws (in
# the first batch) were not root-caused: a scripting mistake in the
# diagnostic script (piping through `tail -80` inside a backgrounded
# shell command) destroyed those 2 draws' individual detail before they
# could be inspected, so their exact failure mode is honestly unknown --
# only the aggregate rate survived. Per this issue's own conservative
# instruction not to force a fix without reproducing the mechanism it is
# meant to address, NO prompting change was made: the described
# inconsistency (originally 1/3, i.e. one small sample) does not reproduce
# at this larger scale, so there is no currently-reproducible gap to
# safely target with a prompting nudge. The most likely explanation is
# that other work already merged in this citation-repair sequence (#105's
# `guideline_excerpts`-into-planner-composition fix, #108's duplicate-
# claim semantic-support fix) improved this case as a side effect without
# it being specifically re-measured since #106/#109's smaller samples --
# the same "small-sample finding turned out stale" pattern #113/#116 also
# found elsewhere in this batch. Un-xfailed on the strength of this
# result; the fresh, first-attempt recording below landed on `verified`,
# consistent with the now-typical (92%) outcome, not a cherry-picked draw.
