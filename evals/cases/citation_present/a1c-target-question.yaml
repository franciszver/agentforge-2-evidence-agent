id: a1c-target-question
category: citation_present
failure_mode: >
  P3G.1: a guideline-answerable chart question must yield an answer whose clinical claim
  carries a VERIFIED guideline_chunk DocumentCitation -- a real retrieved chunk, quoted
  verbatim -- alongside the chart-data citation.
question: "What was her last A1c, and is that at target for her diabetes?"
patient_id: 1
tool_data:
  get_recent_labs:
    items:
      - test_name: "Hemoglobin A1c"
        value: "7.8"
        unit: "%"
        date: "2026-06-01T09:00:00"
        abnormal_flag: "high"
retrieved_chunks:
  - chunk_id: "a1c-targets#target-ranges"
    doc_id: "a1c-targets"
    title: "A1c Targets for Adults with Diabetes"
    section: "Target Ranges"
    text: |-
      - Most non-pregnant adults with diabetes: A1c target generally below 7%.
      - Healthy adults with a long life expectancy and low hypoglycemia risk: a
        stricter target, below 6.5%, may be reasonable if it can be reached safely.
      - Older adults, or those with limited life expectancy, significant
        comorbidity, or a history of severe hypoglycemia: a looser target, such as
        below 8% or 8.5%, is often more appropriate.
      - Pregnant patients with pre-existing or gestational diabetes have distinct,
        tighter glycemic targets that are outside the scope of this summary.
    rerank_score: 0.9
assertions:
  - type: verdict
    equals: verified
  - type: guideline_citation_present
xfail: >
  RE-OBSERVED (issue #106, live re-verification against current main post the
  #85 citation-routing fix / PR #104): re-run live 6 additional times through
  the real pipeline (`evals/runner/pipeline.run_case` and
  `evals/runner/record.py`, production `LlamaServerClient`, no replay). The
  `#85` routing bug does NOT apply here -- inspecting the extractor's
  pre-coercion output directly shows the model emits a correctly-shaped
  `document_citations` entry for `a1c-targets#target-ranges` on its own, never
  the misrouted `source_refs` shape `_coerce_misrouted_guideline_refs`
  targets. The guideline citation now reliably reaches `document_citations`
  and passes provenance re-validation 6/6 times (an improvement over issue
  #100's original finding of "surfaced in every run" but not always framed
  this precisely). The case still does not reach `verified`, for a DIFFERENT,
  more specific reason than #100 originally described: the model's answer
  restates the same target-range fact as two separate claims (e.g. "...above
  the target range..." and "...is not at target."), both citing the SAME
  `a1c-targets#target-ranges` chunk -- and the semantic-support judge is
  inconsistent across the two, correctly validating one occurrence but
  downgrading the other (typically the terser restatement) to
  `not_semantically_supported`, which strips that claim and keeps the overall
  verdict at `partially_verified` (5/6 draws; 1/6 avoided the duplicate
  restatement entirely and reached `verified`). This is a claim-splitting /
  semantic-support-judge-consistency issue, not a citation-routing or
  planner-answer-composition (#105) issue -- documented as a new, separate
  follow-up rather than fixed here (out of #106's scope, which is specifically
  the #85 routing-bug shape). The recording has been re-captured against
  current main with a typical (non-passing) draw -- see
  docs/MODEL_AND_HARDWARE_SELECTION.md for the updated baseline discussion.
