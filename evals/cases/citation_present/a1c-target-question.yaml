id: a1c-target-question
category: citation_present
failure_mode: >
  P3G.1: a guideline-answerable chart question must yield an answer whose clinical claim
  carries a VERIFIED guideline_chunk DocumentCitation -- a real retrieved chunk, quoted
  verbatim -- alongside the chart-data citation.
question: "What was her last A1c, and is that at target for her diabetes?"
patient_id: 1
tool_data:
  get_recent_labs:
    items:
      - test_name: "Hemoglobin A1c"
        value: "7.8"
        unit: "%"
        date: "2026-06-01T09:00:00"
        abnormal_flag: "high"
retrieved_chunks:
  - chunk_id: "a1c-targets#target-ranges"
    doc_id: "a1c-targets"
    title: "A1c Targets for Adults with Diabetes"
    section: "Target Ranges"
    text: |-
      - Most non-pregnant adults with diabetes: A1c target generally below 7%.
      - Healthy adults with a long life expectancy and low hypoglycemia risk: a
        stricter target, below 6.5%, may be reasonable if it can be reached safely.
      - Older adults, or those with limited life expectancy, significant
        comorbidity, or a history of severe hypoglycemia: a looser target, such as
        below 8% or 8.5%, is often more appropriate.
      - Pregnant patients with pre-existing or gestational diabetes have distinct,
        tighter glycemic targets that are outside the scope of this summary.
    rerank_score: 0.9
assertions:
  - type: verdict
    equals: verified
  - type: guideline_citation_present
xfail: >
  OBSERVED (issue #100, live re-verification against current main post
  PR #94/#95/#98/#101): this case was one of the committed 5/12 baseline's
  non-xfail cases, but that pass reflected one stable, frozen recording from
  an earlier draw. Eight independent fresh live runs through the real
  pipeline (`evals/runner/pipeline.run_case`, production `LlamaServerClient`,
  no replay) landed on `verified` only once (12.5%) -- the other seven
  landed on `partially_verified`: the guideline `a1c-targets#target-ranges`
  chunk IS surfaced and cited in every run, but a co-occurring claim (the
  chart-data A1c value/target comparison) fails claim-extraction
  verification often enough to keep the overall verdict below `verified`
  most of the time. Not reliably passing at current live-draw rates -- the
  recording has been re-captured against current main with a typical
  (non-passing) draw rather than the stale lucky draw it replaced -- see
  docs/MODEL_AND_HARDWARE_SELECTION.md for the updated baseline discussion.
