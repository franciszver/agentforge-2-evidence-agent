id: a1c-target-question
category: citation_present
failure_mode: >
  P3G.1: a guideline-answerable chart question must yield an answer whose clinical claim
  carries a VERIFIED guideline_chunk DocumentCitation -- a real retrieved chunk, quoted
  verbatim -- alongside the chart-data citation.
question: "What was her last A1c, and is that at target for her diabetes?"
patient_id: 1
tool_data:
  get_recent_labs:
    items:
      - test_name: "Hemoglobin A1c"
        value: "7.8"
        unit: "%"
        date: "2026-06-01T09:00:00"
        abnormal_flag: "high"
retrieved_chunks:
  - chunk_id: "a1c-targets#target-ranges"
    doc_id: "a1c-targets"
    title: "A1c Targets for Adults with Diabetes"
    section: "Target Ranges"
    text: |-
      - Most non-pregnant adults with diabetes: A1c target generally below 7%.
      - Healthy adults with a long life expectancy and low hypoglycemia risk: a
        stricter target, below 6.5%, may be reasonable if it can be reached safely.
      - Older adults, or those with limited life expectancy, significant
        comorbidity, or a history of severe hypoglycemia: a looser target, such as
        below 8% or 8.5%, is often more appropriate.
      - Pregnant patients with pre-existing or gestational diabetes have distinct,
        tighter glycemic targets that are outside the scope of this summary.
    rerank_score: 0.9
assertions:
  - type: verdict
    equals: verified
  - type: guideline_citation_present
xfail: >
  OBSERVED (re-recorded #81, qwen3-8b-q5, gate ON): given BOTH the real
  chart-data lab result and a retrieved guideline chunk for the same turn,
  this draw's answer stays entirely on the chart data (last A1c value, its
  date, and that it's above target) and never surfaces or quotes the A1c
  target-range guideline passage -- so the claim extractor emits zero
  document_citations and citation_present never fires; the semantic-support
  judge never runs (nothing to re-judge). verdict is genuinely verified on
  the three chart-data claims alone. Same chart-data-only pattern several
  other cases in this category already document under this model, just this
  case's own draw this time (this case's PRIOR recording, pre-#81, DID
  surface a citation -- real run-to-run variance, not a regression from the
  gate itself). An honest, reproducible P3G.1 finding, not a harness bug --
  the assertions are the correct target and are deliberately not weakened.
