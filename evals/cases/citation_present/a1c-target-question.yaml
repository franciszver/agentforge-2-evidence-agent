id: a1c-target-question
category: citation_present
failure_mode: >
  P3G.1: a guideline-answerable chart question must yield an answer whose clinical claim
  carries a VERIFIED guideline_chunk DocumentCitation -- a real retrieved chunk, quoted
  verbatim -- alongside the chart-data citation.
question: "What was her last A1c, and is that at target for her diabetes?"
patient_id: 1
tool_data:
  get_recent_labs:
    items:
      - test_name: "Hemoglobin A1c"
        value: "7.8"
        unit: "%"
        date: "2026-06-01T09:00:00"
        abnormal_flag: "high"
retrieved_chunks:
  - chunk_id: "a1c-targets#target-ranges"
    doc_id: "a1c-targets"
    title: "A1c Targets for Adults with Diabetes"
    section: "Target Ranges"
    text: |-
      - Most non-pregnant adults with diabetes: A1c target generally below 7%.
      - Healthy adults with a long life expectancy and low hypoglycemia risk: a
        stricter target, below 6.5%, may be reasonable if it can be reached safely.
      - Older adults, or those with limited life expectancy, significant
        comorbidity, or a history of severe hypoglycemia: a looser target, such as
        below 8% or 8.5%, is often more appropriate.
      - Pregnant patients with pre-existing or gestational diabetes have distinct,
        tighter glycemic targets that are outside the scope of this summary.
    rerank_score: 0.9
assertions:
  - type: verdict
    equals: verified
  - type: guideline_citation_present
# issue #108 FIXED (live re-verification against current main): the
# semantic-support judge previously scored the model's two paraphrased
# restatements of the same target-range fact (both citing the identical
# `a1c-targets#target-ranges` quote) inconsistently -- validating one,
# downgrading the other. `app.semantic_support.apply_semantic_support` now
# groups DocumentCitation results by exact evidence identity (source_type,
# source_id, field_or_chunk_id, quote_or_value) and judges each distinct
# identity ONCE, so duplicate claims citing identical evidence can never
# disagree. Re-run live 8 times through the real pipeline
# (`evals/runner/pipeline.run_case`, production `LlamaServerClient`, no
# replay) post-fix: 7/8 draws reach `verified`. The 1/8 miss is a DIFFERENT,
# pre-existing mechanism (unrelated to #108): that one draw's answer never
# attempted the guideline citation at all (chart-data-only, zero
# `document_citations`) -- the same planner/extraction variance
# `docs/MODEL_AND_HARDWARE_SELECTION.md` already discloses for this
# hardware tier, not a judge-consistency defect. The committed recording
# below captures a typical (now-passing) `verified` draw.
