id: lithium-nsaid-question
category: citation_present
failure_mode: >
  P3G.1: a guideline-answerable chart question must yield an answer whose clinical claim
  carries a VERIFIED guideline_chunk DocumentCitation -- a real retrieved chunk, quoted
  verbatim -- alongside the chart-data citation.
question: "He takes lithium and wants to use ibuprofen for back pain -- is that okay?"
patient_id: 2
tool_data:
  get_medications:
    items:
      - name: "Lithium Carbonate"
        dose: "300mg"
        route: "oral"
        status: "active"
retrieved_chunks:
  - chunk_id: "nsaid-interactions#lithium"
    doc_id: "nsaid-interactions"
    title: "NSAID Drug-Interaction Cautions"
    section: "Lithium"
    text: >
      NSAIDs can reduce renal lithium clearance, raising lithium levels toward toxicity;
      this combination generally calls for closer lithium-level monitoring if it cannot be
      avoided.
    rerank_score: 0.9
assertions:
  - type: verdict
    equals: verified
  - type: guideline_citation_present
xfail: >
  RE-OBSERVED (issue #106, live re-verification against current main post the
  #85 citation-routing fix / PR #104): re-run live 11 additional times
  through the real pipeline (`evals/runner/pipeline.run_case` and
  `evals/runner/record.py`, production `LlamaServerClient`, no replay). The
  `#85` routing bug does NOT apply here -- inspecting the extractor's
  pre-coercion output directly shows the model emits a correctly-shaped
  `document_citations` entry for `nsaid-interactions#lithium` on its own,
  never the misrouted `source_refs` shape `_coerce_misrouted_guideline_refs`
  targets. This is a real improvement over issue #100's original finding
  (citation survived only 4/8 draws): the guideline citation now reliably
  reaches `document_citations` and passes provenance re-validation 11/11
  times. The case still never reaches `verified`, for the SAME specific
  reason as `a1c-target-question`'s re-observation above: the model's
  answer restates the interaction caution across two separate claims (e.g.
  "...requires caution, as ibuprofen can increase the risk of lithium
  toxicity." and "It is important to monitor the patient closely for signs
  of lithium toxicity..."), both citing the SAME
  `nsaid-interactions#lithium` chunk -- the semantic-support judge validates
  the first occurrence but deterministically downgrades the second
  (monitoring-advice) restatement to `not_semantically_supported` (11/11
  draws), stripping that claim and keeping the verdict at
  `partially_verified`. A claim-splitting / semantic-support-judge-
  consistency issue, not a citation-routing or planner-answer-composition
  (#105) issue -- documented as a new, separate follow-up rather than fixed
  here (out of #106's scope). The recording has been re-captured against
  current main with this (now fully deterministic) draw -- see
  docs/MODEL_AND_HARDWARE_SELECTION.md for the updated baseline discussion.
