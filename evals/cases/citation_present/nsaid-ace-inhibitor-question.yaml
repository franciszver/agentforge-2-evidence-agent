id: nsaid-ace-inhibitor-question
category: citation_present
failure_mode: >
  P3G.1: a guideline-answerable chart question must yield an answer whose clinical claim
  carries a VERIFIED guideline_chunk DocumentCitation -- a real retrieved chunk, quoted
  verbatim -- alongside the chart-data citation.
question: "She wants to take ibuprofen for a headache -- is that a concern given her lisinopril?"
patient_id: 1
tool_data:
  get_medications:
    items:
      - name: "Lisinopril"
        dose: "10mg"
        route: "oral"
        status: "active"
retrieved_chunks:
  - chunk_id: "nsaid-interactions#ace-inhibitors-and-arbs"
    doc_id: "nsaid-interactions"
    title: "NSAID Drug-Interaction Cautions"
    section: "ACE Inhibitors and ARBs"
    text: |-
      Combining an NSAID with an ACE inhibitor (e.g. lisinopril) or an
      angiotensin-receptor blocker (e.g. losartan) can blunt the blood-pressure-
      lowering effect and, more importantly, can reduce renal perfusion — the
      combination is sometimes described as part of a "triple whammy" when a
      diuretic is also present. Caution is generally warranted, especially in
      older adults, patients with reduced kidney function, or those who are
      volume-depleted; renal function is often checked if the combination is used
      for more than a short course.
    rerank_score: 0.9
assertions:
  - type: verdict
    equals: verified
  - type: guideline_citation_present
