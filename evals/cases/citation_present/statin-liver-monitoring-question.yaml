id: statin-liver-monitoring-question
category: citation_present
failure_mode: >
  P3G.1: a guideline-answerable chart question must yield an answer whose clinical claim
  carries a VERIFIED guideline_chunk DocumentCitation -- a real retrieved chunk, quoted
  verbatim -- alongside the chart-data citation.
question: "He's on a statin -- does he need routine liver-enzyme monitoring?"
patient_id: 1
tool_data:
  get_medications:
    items:
      - name: "Atorvastatin"
        dose: "20mg"
        route: "oral"
        status: "active"
retrieved_chunks:
  - chunk_id: "statin-monitoring#baseline-liver-function"
    doc_id: "statin-monitoring"
    title: "Statin Therapy Monitoring"
    section: "Baseline Liver Function"
    text: |-
      A baseline liver panel (e.g. ALT) is generally obtained before starting a
      statin. Routine ongoing liver-enzyme monitoring in an asymptomatic patient
      is usually not needed; liver enzymes are checked if the patient develops
      symptoms suggestive of hepatotoxicity (e.g. unexplained fatigue, jaundice,
      right-upper-quadrant pain) or if clinically indicated for another reason.
    rerank_score: 0.9
assertions:
  - type: verdict
    equals: verified
  - type: guideline_citation_present
xfail: >
  OBSERVED (issue #81, gate-ON re-judge of the stable committed recording,
  live Qwen3-8B-Q5 semantic-support judge): this is the case #47/#81
  specifically targeted. The recorded answer carries a real, verbatim
  DocumentCitation from `statin-monitoring#baseline-liver-function` --
  `check_document_citation` correctly renders it VALID (the quote is
  genuinely from the source). But the quote says routine liver-enzyme
  monitoring is usually NOT needed for an asymptomatic patient, while the
  claim it's attached to asserts monitoring IS generally recommended /
  worth considering -- a real, verbatim guideline quote paired with an
  unrelated-in-direction claim, exactly the provenance-without-support
  defect issue #47 was written to catch. The live semantic-support judge
  correctly calls BOTH affected claims `not_supported`, downgrading the
  overall verdict to `partially_verified`. Honestly NOT a supported
