id: statin-liver-monitoring-question
category: citation_present
failure_mode: >
  P3G.1: a guideline-answerable chart question must yield an answer whose clinical claim
  carries a VERIFIED guideline_chunk DocumentCitation -- a real retrieved chunk, quoted
  verbatim -- alongside the chart-data citation.
question: "He's on a statin -- does he need routine liver-enzyme monitoring?"
patient_id: 1
tool_data:
  get_medications:
    items:
      - name: "Atorvastatin"
        dose: "20mg"
        route: "oral"
        status: "active"
retrieved_chunks:
  - chunk_id: "statin-monitoring#baseline-liver-function"
    doc_id: "statin-monitoring"
    title: "Statin Therapy Monitoring"
    section: "Baseline Liver Function"
    text: |-
      A baseline liver panel (e.g. ALT) is generally obtained before starting a
      statin. Routine ongoing liver-enzyme monitoring in an asymptomatic patient
      is usually not needed; liver enzymes are checked if the patient develops
      symptoms suggestive of hepatotoxicity (e.g. unexplained fatigue, jaundice,
      right-upper-quadrant pain) or if clinically indicated for another reason.
    rerank_score: 0.9
assertions:
  - type: verdict
    equals: verified
  - type: guideline_citation_present
xfail: >
  OBSERVED (recorded, qwen3:4b): the claim extractor emits two
  document_citations entries for the liver-function-monitoring chunk. Both
  give "field_or_chunk_id" as the bare section slug
  ("baseline-liver-function") instead of the fully-qualified chunk id
  ("statin-monitoring#baseline-liver-function"), so
  ``check_document_citation`` returns UNKNOWN_CHUNK. Separately, the quoted
  text ends "...suggestive of hepatotoxicity." where the real chunk
  continues "(e.g. unexplained fatigue, jaundice, right-upper-quadrant
  pain) or if clinically indicated for another reason." -- so the quote is
  not a verbatim substring of the real chunk text even under a correct
  chunk id. verdict stays partially_verified; guideline_citation_present
  never fires.
