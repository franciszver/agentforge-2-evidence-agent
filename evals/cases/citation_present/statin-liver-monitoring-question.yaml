id: statin-liver-monitoring-question
category: citation_present
failure_mode: >
  P3G.1: a guideline-answerable chart question must yield an answer whose clinical claim
  carries a VERIFIED guideline_chunk DocumentCitation -- a real retrieved chunk, quoted
  verbatim -- alongside the chart-data citation.
question: "He's on a statin -- does he need routine liver-enzyme monitoring?"
patient_id: 1
tool_data:
  get_medications:
    items:
      - name: "Atorvastatin"
        dose: "20mg"
        route: "oral"
        status: "active"
retrieved_chunks:
  - chunk_id: "statin-monitoring#baseline-liver-function"
    doc_id: "statin-monitoring"
    title: "Statin Therapy Monitoring"
    section: "Baseline Liver Function"
    text: |-
      A baseline liver panel (e.g. ALT) is generally obtained before starting a
      statin. Routine ongoing liver-enzyme monitoring in an asymptomatic patient
      is usually not needed; liver enzymes are checked if the patient develops
      symptoms suggestive of hepatotoxicity (e.g. unexplained fatigue, jaundice,
      right-upper-quadrant pain) or if clinically indicated for another reason.
    rerank_score: 0.9
assertions:
  - type: verdict
    equals: verified
  - type: guideline_citation_present
xfail: >
  OBSERVED (re-recorded #81, qwen3-8b-q5, gate ON -- issue #47/#81's whole
  reason for existing). This case's PRE-#81 recording had a genuine
  provenance-without-support defect: the model paired a real, verbatim
  quote ("Routine ongoing liver-enzyme monitoring in an asymptomatic
  patient is usually not needed") with a claim asserting the opposite
  ("Routine liver-enzyme monitoring is generally recommended") -- exactly
  the failure mode issue #47 was opened to catch. Re-recorded against the
  live model with the gate ON to see whether a fresh draw would answer
  faithfully: this draw hedges overall (closes with "it is not possible to
  determine if routine monitoring is required" once the specific statin is
  unclear), but two of its individual extracted claims still assert
  monitoring "is typically recommended for patients on certain statins" and
  that the clinician "should review the specific statin ... to make an
  informed decision about monitoring" -- both paired with real, verbatim
  guideline quotes that are on-topic but do not actually say what the claim
  says. The semantic-support judge (Qwen3-8B-Q5, the same engine) correctly
  calls BOTH not_supported: the first quote is about a baseline panel
  BEFORE starting a statin, not about ongoing monitoring being
  recommended; the second is about whether monitoring is needed at all, not
  about reviewing which specific statin is in use. Both citations are
  downgraded to NOT_SEMANTICALLY_SUPPORTED, no claim in this answer
  survives with a verified guideline_chunk citation, and the verdict lands
  on partially_verified. This is the gate doing exactly its job -- a real,
  verbatim quote is still not enough when the claim it's paired with
  doesn't actually follow from it. Honestly NOT a 6th supported citation;
  the P3G.1 assertions are the correct target and are deliberately not
  weakened.
