id: statin-liver-monitoring-question
category: citation_present
failure_mode: >
  P3G.1: a guideline-answerable chart question must yield an answer whose clinical claim
  carries a VERIFIED guideline_chunk DocumentCitation -- a real retrieved chunk, quoted
  verbatim -- alongside the chart-data citation.
question: "He's on a statin -- does he need routine liver-enzyme monitoring?"
patient_id: 1
tool_data:
  get_medications:
    items:
      - name: "Atorvastatin"
        dose: "20mg"
        route: "oral"
        status: "active"
retrieved_chunks:
  - chunk_id: "statin-monitoring#baseline-liver-function"
    doc_id: "statin-monitoring"
    title: "Statin Therapy Monitoring"
    section: "Baseline Liver Function"
    text: |-
      A baseline liver panel (e.g. ALT) is generally obtained before starting a
      statin. Routine ongoing liver-enzyme monitoring in an asymptomatic patient
      is usually not needed; liver enzymes are checked if the patient develops
      symptoms suggestive of hepatotoxicity (e.g. unexplained fatigue, jaundice,
      right-upper-quadrant pain) or if clinically indicated for another reason.
    rerank_score: 0.9
assertions:
  - type: verdict
    equals: verified
  - type: guideline_citation_present
xfail: >
  OBSERVED (recorded, qwen3:4b, post-P3G.1b prompt-eng): given BOTH real
  chart-data tool results and a retrieved guideline chunk for the same turn,
  the model DOES now attempt to surface the guideline passage -- the claim
  extractor emits TWO document_citations entries quoting the liver-function
  monitoring chunk with a genuinely verbatim quote. But both entries give
  "field_or_chunk_id" as the bare section slug ("baseline-liver-function")
  instead of the full, doc-id-qualified chunk id shown in the guideline
  catalog ("statin-monitoring#baseline-liver-function") -- despite the
  extraction prompt explicitly instructing "copied in full (e.g.
  'a1c-targets#target-ranges', not just 'target-ranges')" -- so
  ``check_document_citation`` fails closed with UNKNOWN_CHUNK (no chunk
  exists under the truncated id) and citation_present never fires (verdict
  stays verified/partially_verified on the chart-data claims alone). This is
  an honest, reproducible P3G.1 finding: the local 4B model's grasp of the
  guideline evidence and its ability to quote it verbatim have both measurably
  improved with the P3G.1b prompt-eng iteration (see the sibling
  a1c-target-question and warfarin-antibiotic-question cases, which now
  genuinely pass), but its adherence to the exact chunk-id FORMAT the
  citation schema requires remains unreliable -- not a harness bug; the
  assertions are the correct target and are deliberately not weakened.
