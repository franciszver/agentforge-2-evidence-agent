[project]
name = "copilot-agent"
version = "2.3.0"
description = "Clinical Co-Pilot FastAPI agent service"
requires-python = ">=3.11"
# Issue #196: every dependency below is bounded on floor AND ceiling, so
# every environment (dev venv, CI, release install) resolves the exact
# version this pyproject was verified against, not just something inside a
# loose range -- see #184, where an unbounded floor let fastapi 0.124.4
# resolve and reintroduce already-fixed OpenAPI schema drift. Floors equal
# the verified version below; ceilings follow an ecosystem-appropriate
# policy -- next MAJOR for packages that only break API on a major bump,
# next MINOR for 0.x packages where any minor can break. Full policy
# discussion and rejected alternatives (exact `==` pins, a lockfile): #196.
dependencies = [
    "fastapi>=0.139.2,<0.140",  # verified: 0.139.2 -- 0.x: any minor may break (ceiling trails latest 0.140.7, deliberate; see PR)
    "uvicorn[standard]>=0.51.0,<0.52",  # verified: 0.51.0 -- 0.x: any minor may break
    "pydantic>=2.13.4,<3",  # verified: 2.13.4 -- semver: only a major breaks
    "pydantic-settings>=2.14.2,<3",  # verified: 2.14.2 -- semver: only a major breaks
    "httpx>=0.28.1,<1",  # verified: 0.28.1 -- semver-respecting despite 0.x versioning
    # PDF page rendering for document ingestion (P3.1, app/ingestion.py).
    "pypdfium2>=5.12.1,<6",  # verified: 5.12.1 -- minor tracks vendored PDFium build (not semver); zero OSV advisories (CVEs tracked under Chromium), so a tight ceiling would silently freeze this untrusted-PDF parser with no bump signal
    # app/ingestion.py's render_pdf_pages_to_png calls pypdfium2's
    # PdfBitmap.to_pil(), which lazy-imports PIL at call time -- undeclared
    # here, it was only ever present in this project's dev/test venvs as an
    # indirect dep of dev extras' fpdf2 (see below), never in the production
    # image (`pip install .` with no extras). ModuleNotFoundError on the
    # FIRST real ingestion call in any container built from this
    # pyproject.toml -- found live during the P5.1 demo dry run (issue #27)
    # when seed_demo_documents.py's ingestion path was run for the first
    # time against a real built image, not the dev/test venv.
    "pillow>=12.3.0,<13",  # verified: 12.3.0 -- ships security fixes in minors (91/152 OSV advisories fixed in a .0 release); ceiling one major up keeps those flowing
    # YAML front-matter parsing (corpus docs, app/retrieval.py) and
    # app/review_queue.py's pre-existing (previously undeclared) use.
    "pyyaml>=6.0.3,<7",  # verified: 6.0.3 -- semver: only a major breaks
]

[project.optional-dependencies]
# Same floor/ceiling policy as the dependencies list above (#196).
dev = [
    "pytest>=9.1.1,<10",  # verified: 9.1.1 -- semver: only a major breaks
    "pytest-cov>=7.1.0,<8",  # verified: 7.1.0 -- semver: only a major breaks
    "playwright>=1.61.0,<2",  # verified: 1.61.0 -- semver: only a major breaks
    "pytest-playwright>=0.8.0,<1",  # verified: 0.8.0 -- semver-respecting despite 0.x versioning
    "mypy>=2.3.0,<3",  # verified: 2.3.0 -- semver: only a major breaks
    # scripts/generate_lab_pdf_fixture.py only -- writing the P3.1 lab-PDF
    # test fixture, never imported by app/ code.
    "fpdf2>=2.8.7,<3",  # verified: 2.8.7 -- semver: only a major breaks
    # tests/test_openapi_contract.py only -- validating real responses
    # against the schemas declared in the pinned OpenAPI spec.
    "jsonschema>=4.26.0,<5",  # verified: 4.26.0 -- semver: only a major breaks
    # tests/test_dependency_bounds.py imports packaging.requirements /
    # packaging.specifiers directly; previously undeclared, resolving only
    # as pytest's unbounded transitive dep (same undeclared-transitive
    # pattern as the pillow/PIL incident above, #27).
    "packaging>=26.2,<27",  # verified: 26.2 -- semver: only a major breaks
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "browser: requires a real browser (Playwright)",
    "integration: requires the running dev stack (OpenEMR + OAuth)",
]

[tool.mypy]
files = ["app"]
ignore_missing_imports = true

[tool.coverage.report]
exclude_also = [
    "assert_never\\(",
    "case _:$",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.schemas", "app.tools", "app.data"]

[tool.setuptools.package-data]
"app.data" = ["*.csv", "*.db", "*.sha256", "*.json"]
