name: copilot-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  agent-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install agent
        working-directory: services/copilot-agent
        run: pip install -e ".[dev]"

      - name: Type check (mypy)
        working-directory: services/copilot-agent
        run: mypy app/

      - name: Run pytest (exclude browser tests)
        working-directory: services/copilot-agent
        run: pytest -m "not browser and not integration"

      - name: Verification-layer coverage gate
        working-directory: services/copilot-agent
        run: |
          pytest -m "not browser and not integration" \
            --cov=app.verification --cov=app.rendering --cov=app.allergy_check \
            --cov=app.check_drug_interactions --cov=app.verdict \
            --cov=app.introspection --cov=app.launch_binding \
            --cov-branch --cov-report=term-missing --cov-fail-under=99

      - name: Eval replay (offline, no model inference)
        run: pytest evals/ -m "not integration"

  dependency-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install agent + pip-audit
        working-directory: services/copilot-agent
        run: |
          pip install --upgrade pip setuptools
          pip install -e ".[dev]" pip-audit

      - name: Audit dependencies for known vulnerabilities
        working-directory: services/copilot-agent
        run: pip-audit

      - name: Audit locked container dependencies for known vulnerabilities
        working-directory: services/copilot-agent
        # Separate from the env audit above: this reads requirements.txt (the
        # hash-locked production runtime closure the Dockerfile installs,
        # issue 213) directly, so a vulnerable transitive pinned in the lock
        # is caught even if the dev/test env above resolved something else.
        run: pip-audit -r requirements.txt

  container-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build copilot-agent image
        # No push -- this job exists purely to catch a broken lockfile or
        # Dockerfile (issue 213) before merge; nothing else in this
        # workflow builds the image.
        run: docker build services/copilot-agent

  jest-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install JS dependencies
        run: npm ci --ignore-scripts

      - name: Run JS unit tests (jest)
        run: npm run test:js

  module-isolated-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.2'
          extensions: bcmath, calendar, gd, imagick, intl, ldap, redis, soap, xsl, zip
          tools: composer:v2
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Run Clinical Co-Pilot module isolated tests (no DB)
        run: vendor/bin/phpunit -c phpunit-isolated.xml tests/Tests/Isolated/Modules/ClinicalCopilot
