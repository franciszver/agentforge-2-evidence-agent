# Co-Pilot overlay: adds the `agent` (FastAPI clinical co-pilot) and `ollama`
# (local LLM runtime) services.
#
# Security intent: `agent` and `ollama` are attached ONLY to the internal
# `copilot_internal` network, which is declared `internal: true` — Docker
# blocks all outbound traffic from that network to the outside world, so
# neither service can reach the public internet or exfiltrate PHI. `agent`
# reaches OpenEMR over this same internal network, so `openemr` is also
# attached to it (in addition to its existing default network, which it
# still needs for its own normal operation).
#
# This overlay touches `openemr` for two reasons: (a) attaching it to the
# internal `copilot_internal` network so the agent can reach it, and
# (b) setting DEMO_MODE: standard to load the OpenEMR demo dataset.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.copilot.yml up
services:
  openemr:
    environment:
      DEMO_MODE: standard
    networks:
      - default
      - copilot_internal

  ollama:
    restart: always
    image: ollama/ollama:0.32.0@sha256:57f573b47f1f71ebb445789f279fe3e596a8beab182f7cf486db9205bad87c5a
    volumes:
      - ollamamodels:/root/.ollama
    networks:
      - copilot_internal
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      start_period: 30s
      interval: 30s
      timeout: 5s
      retries: 3

  # P3.10a (epic #52 step 1): local llama.cpp llama-server, serving ONLY the
  # text-generation LLM roles (planner chat/answer, claim extraction,
  # LLM-as-reranker) -- see agent's COPILOT_LLM_ENGINE below. Embeddings and
  # vision document-ingestion extraction stay on `ollama` above; this
  # service does not replace it.
  #
  # Image pin: ghcr.io/ggml-org/llama.cpp's `server-cuda-b10068` tag (CUDA 12
  # build), matching this repo's ollama pin convention (explicit tag +
  # digest). Verified via `docker buildx imagetools inspect` against the live
  # registry at pin time.
  #
  # GGUF pin: `gguf-init` downloads a specific Hugging Face revision (a
  # commit SHA, not `main`) into the `llamacppmodels` named volume before
  # `llama-server` starts, so the model file is reproducible without baking
  # an 18GB+ layer into the image or committing it to git:
  #   repo:     bartowski/Qwen_Qwen3-8B-GGUF
  #   revision: 0b69f75b7472688e6808490aa2b85efdb81b5ce7
  #   file:     Qwen_Qwen3-8B-Q5_K_M.gguf (~5.85GB)
  # Settled rung (docs/MODEL_AND_HARDWARE_SELECTION.md, other branch): 16k
  # context, q8_0 KV cache (needs --flash-attn on), fully GPU-resident.
  gguf-init:
    image: python:3.12-slim
    volumes:
      - llamacppmodels:/models
    command:
      - sh
      - -c
      - |
        set -e
        if [ -f /models/qwen3-8b-q5_k_m.gguf ]; then
          echo "GGUF already present, skipping download"; exit 0
        fi
        pip install --no-cache-dir --quiet "huggingface_hub[cli]"
        huggingface-cli download bartowski/Qwen_Qwen3-8B-GGUF \
          --revision 0b69f75b7472688e6808490aa2b85efdb81b5ce7 \
          --include "Qwen_Qwen3-8B-Q5_K_M.gguf" \
          --local-dir /tmp/gguf-download
        mv /tmp/gguf-download/Qwen_Qwen3-8B-Q5_K_M.gguf /models/qwen3-8b-q5_k_m.gguf
    networks:
      - copilot_internal

  llama-server:
    restart: always
    image: ghcr.io/ggml-org/llama.cpp:server-cuda-b10068@sha256:b8791d2ab8c51570e75067f626db7a271caa3e99396056f2721fac432e03c852
    volumes:
      - llamacppmodels:/models
    command:
      - "--model"
      - "/models/qwen3-8b-q5_k_m.gguf"
      - "--ctx-size"
      - "16384"
      - "--parallel"
      - "1"
      - "--cache-type-k"
      - "q8_0"
      - "--cache-type-v"
      - "q8_0"
      - "--flash-attn"
      - "on"
      - "--n-gpu-layers"
      - "999"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "--reasoning"
      - "off"
    depends_on:
      gguf-init:
        condition: service_completed_successfully
    networks:
      - copilot_internal
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8080/health || exit 1"]
      start_period: 60s
      interval: 30s
      timeout: 5s
      retries: 3

  agent:
    build:
      context: ../../services/copilot-agent
    environment:
      OPENEMR_BASE_URL: https://openemr
      OLLAMA_BASE_URL: http://ollama:11434
      # P3.10a: default "ollama" -- flip to "llama_server" to route the
      # answer/extract/reranker roles through llama-server below. Embeddings
      # always use OLLAMA_BASE_URL above regardless of this flag.
      COPILOT_LLM_ENGINE: ollama
      LLAMA_SERVER_BASE_URL: http://llama-server:8080
    networks:
      - copilot_internal
    depends_on:
      - ollama
      - llama-server

networks:
  copilot_internal:
    internal: true

volumes:
  ollamamodels: {}
  llamacppmodels: {}
