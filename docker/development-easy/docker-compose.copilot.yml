# Co-Pilot overlay: adds the `agent` (FastAPI clinical co-pilot) and `ollama`
# (local LLM runtime) services.
#
# Security intent: `agent` and `ollama` are attached ONLY to the internal
# `copilot_internal` network, which is declared `internal: true` — Docker
# blocks all outbound traffic from that network to the outside world, so
# neither service can reach the public internet or exfiltrate PHI. `agent`
# reaches OpenEMR over this same internal network, so `openemr` is also
# attached to it (in addition to its existing default network, which it
# still needs for its own normal operation).
#
# This overlay touches `openemr` for two reasons: (a) attaching it to the
# internal `copilot_internal` network so the agent can reach it, and
# (b) setting DEMO_MODE: standard to load the OpenEMR demo dataset.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.copilot.yml up --build
# --build is required (#180), not just `up`: the `agent` image's
# /data/traces mountpoint (this file's persistent trace-store volume, see
# the `agent` service below) only exists, correctly owned, in an image
# built from the current Dockerfile. `docker compose up` alone rebuilds
# only when no image exists at all, so a machine with a previously built
# `agent` image would start it unrebuilt against the new mount instead --
# every request to the agent then fails with a 500 (see the `agent`
# service's volumes comment below).
services:
  openemr:
    environment:
      DEMO_MODE: standard
    networks:
      - default
      - copilot_internal

  ollama:
    restart: always
    image: ollama/ollama:0.32.0@sha256:57f573b47f1f71ebb445789f279fe3e596a8beab182f7cf486db9205bad87c5a
    volumes:
      - ollamamodels:/root/.ollama
    networks:
      - copilot_internal
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      start_period: 30s
      interval: 30s
      timeout: 5s
      retries: 3

  # P3.10a (epic #52 step 1): local llama.cpp llama-server, serving ONLY the
  # text-generation LLM roles (planner chat/answer, claim extraction,
  # LLM-as-reranker) -- see agent's COPILOT_LLM_ENGINE below. Embeddings and
  # vision document-ingestion extraction stay on `ollama` above; this
  # service does not replace it.
  #
  # P3.10e (issue #73, owner decision 2026-07-19): both services below used
  # to be gated behind the `llama` compose profile so a plain `docker
  # compose ... up` defaulted to ollama with no extra startup cost. That
  # profile gate is now REMOVED -- 8B-Q5 is the intended default answer
  # model (the 5/12 verified-citation flagship capability must be live out
  # of the box), so a plain `docker compose -f docker-compose.yml -f
  # docker-compose.copilot.yml up` now provisions and serves it
  # unconditionally. Deliberate tradeoff accepted: default startup gains a
  # one-time GGUF provisioning-egress step (`gguf-init`, skipped once the
  # volume is populated) and ~60s of model load before `llama-server`
  # reports healthy. Security posture is unchanged from #56: `llama-server`
  # itself stays `copilot_internal`-only (no egress); only `gguf-init`
  # reaches the public internet, and only for the one-time pinned pull.
  #
  # Image pin: ghcr.io/ggml-org/llama.cpp's `server-cuda-b10068` tag (CUDA 12
  # build), matching this repo's ollama pin convention (explicit tag +
  # digest). Verified via `docker buildx imagetools inspect` against the live
  # registry at pin time.
  #
  # GGUF pin: `gguf-init` downloads a specific Hugging Face revision (a
  # commit SHA, not `main`) into the `llamacppmodels` named volume before
  # `llama-server` starts, so the model file is reproducible without baking
  # an 18GB+ layer into the image or committing it to git:
  #   repo:     bartowski/Qwen_Qwen3-8B-GGUF
  #   revision: 0b69f75b7472688e6808490aa2b85efdb81b5ce7
  #   file:     Qwen_Qwen3-8B-Q5_K_M.gguf (~5.85GB)
  # Settled rung (docs/MODEL_AND_HARDWARE_SELECTION.md, other branch): 16k
  # context, q8_0 KV cache (needs --flash-attn on), fully GPU-resident.
  #
  # Egress note: `gguf-init` is the only place in this overlay that needs to
  # reach the public internet (Hugging Face), so it stays on the compose
  # `default` network (egress-capable) instead of `copilot_internal`.
  # `llama-server` itself only reads the already-downloaded GGUF from the
  # shared volume, so it stays internal-only like `ollama` and `agent`.
  #
  # Both services now start by default on a plain `docker compose -f
  # docker-compose.yml -f docker-compose.copilot.yml up`: `gguf-init` pulls
  # the pinned GGUF into the `llamacppmodels` volume (skipping the download
  # if it's already present), then `llama-server` waits on it and starts.
  # To roll back to Ollama-only for the answer/extract/reranker roles,
  # override `agent`'s COPILOT_LLM_ENGINE to `ollama` (the containers below
  # still start, but the agent stops routing text-generation traffic to
  # `llama-server`).
  gguf-init:
    image: python:3.12-slim
    volumes:
      - llamacppmodels:/models
    command:
      - sh
      - -c
      - |
        set -e
        GGUF_FILE=qwen3-8b-q5_k_m.gguf
        if [ -f "/models/$${GGUF_FILE}" ]; then
          echo "GGUF already present, skipping download"; exit 0
        fi
        pip install --no-cache-dir --quiet "huggingface_hub[cli]"
        hf download bartowski/Qwen_Qwen3-8B-GGUF \
          --revision 0b69f75b7472688e6808490aa2b85efdb81b5ce7 \
          --include "Qwen_Qwen3-8B-Q5_K_M.gguf" \
          --local-dir /tmp/gguf-download
        mv "/tmp/gguf-download/Qwen_Qwen3-8B-Q5_K_M.gguf" "/models/$${GGUF_FILE}"
    networks:
      - default

  llama-server:
    restart: always
    image: ghcr.io/ggml-org/llama.cpp:server-cuda-b10068@sha256:b8791d2ab8c51570e75067f626db7a271caa3e99396056f2721fac432e03c852
    volumes:
      - llamacppmodels:/models
    command:
      - "--model"
      - "/models/qwen3-8b-q5_k_m.gguf"
      - "--ctx-size"
      - "16384"
      - "--parallel"
      - "1"
      - "--cache-type-k"
      - "q8_0"
      - "--cache-type-v"
      - "q8_0"
      - "--flash-attn"
      - "on"
      - "--n-gpu-layers"
      - "999"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "--reasoning"
      - "off"
    depends_on:
      gguf-init:
        condition: service_completed_successfully
    networks:
      - copilot_internal
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8080/health || exit 1"]
      start_period: 60s
      interval: 30s
      timeout: 5s
      retries: 3

  # P3.10b (epic #52 step 2): a SECOND llama-server instance, running in
  # `--embedding` mode, serving `nomic-embed-text-v1.5` -- migrates dense-
  # vector embeddings for hybrid guideline-corpus retrieval off `ollama`.
  # Distinct container/GGUF from `llama-server` above (that one serves
  # chat/extract/rerank, plain decoding, no `--embedding`); nomic-embed is
  # tiny (~274MB, same size class as Ollama's own nomic-embed-text tag) so
  # it stays GPU-resident alongside the 8B-Q5 chat model with room to spare.
  #
  # `--pooling mean` matches nomic-embed's expected pooling strategy (mean
  # over token embeddings); llama.cpp errors out at load time if a
  # nomic-bert-architecture GGUF is loaded without an explicit pooling type.
  # Un-normalized output is fine: `app.retrieval`'s cosine similarity is
  # scale-invariant per vector, so an engine-side normalization difference
  # from Ollama's never changes retrieval ranking (see
  # app/llama_server_embed_client.py's module docstring).
  #
  # Image pin: same `server-cuda-b10068` tag/digest as `llama-server` above
  # (one llama.cpp build serves both roles).
  #
  # GGUF pin: `gguf-init-embed` downloads a specific Hugging Face revision
  # (a commit SHA, not `main`) into the `llamacppembedmodels` named volume
  # before `llama-server-embed` starts, same reproducibility discipline as
  # `gguf-init` above:
  #   repo:     nomic-ai/nomic-embed-text-v1.5-GGUF
  #   revision: 0188c9bf409793f810680a5a431e7b899c46104c
  #   file:     nomic-embed-text-v1.5.f16.gguf (~274MB, full fp16 precision
  #             -- chosen over a quantized variant to minimize embedding
  #             drift from Ollama's own nomic-embed-text weights, since this
  #             is the tiny embedding model, not the 8B chat model where
  #             quantization is a real memory/speed tradeoff)
  #
  # Egress note: same pattern as `gguf-init` -- `gguf-init-embed` is the only
  # place in this service pair that reaches the public internet (Hugging
  # Face), on the compose `default` network. `llama-server-embed` itself
  # only reads the already-downloaded GGUF from the shared volume, so it
  # stays `copilot_internal`-only (no egress), same as every other inference
  # service in this overlay.
  gguf-init-embed:
    image: python:3.12-slim
    volumes:
      - llamacppembedmodels:/models
    command:
      - sh
      - -c
      - |
        set -e
        GGUF_FILE=nomic-embed-text-v1.5.f16.gguf
        if [ -f "/models/$${GGUF_FILE}" ]; then
          echo "GGUF already present, skipping download"; exit 0
        fi
        pip install --no-cache-dir --quiet "huggingface_hub[cli]"
        hf download nomic-ai/nomic-embed-text-v1.5-GGUF \
          --revision 0188c9bf409793f810680a5a431e7b899c46104c \
          --include "nomic-embed-text-v1.5.f16.gguf" \
          --local-dir /tmp/gguf-download
        mv "/tmp/gguf-download/nomic-embed-text-v1.5.f16.gguf" "/models/$${GGUF_FILE}"
    networks:
      - default

  llama-server-embed:
    restart: always
    image: ghcr.io/ggml-org/llama.cpp:server-cuda-b10068@sha256:b8791d2ab8c51570e75067f626db7a271caa3e99396056f2721fac432e03c852
    volumes:
      - llamacppembedmodels:/models
    command:
      - "--model"
      - "/models/nomic-embed-text-v1.5.f16.gguf"
      - "--embedding"
      - "--pooling"
      - "mean"
      - "--ctx-size"
      - "2048"
      - "--n-gpu-layers"
      - "999"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
    depends_on:
      gguf-init-embed:
        condition: service_completed_successfully
    networks:
      - copilot_internal
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8080/health || exit 1"]
      start_period: 60s
      interval: 30s
      timeout: 5s
      retries: 3

  agent:
    build:
      context: ../../services/copilot-agent
    # Issue #173: hard memory ceiling on the agent container. Catches every
    # unbounded-growth failure mode -- not just a body-size bug in
    # app.body_size_limit.BodySizeLimitMiddleware (see that module and
    # app/config.py's DEFAULT_MAX_REQUEST_BODY_BYTES), but also any future
    # regression in #167's ConversationStore retention caps or anything else
    # this lightweight FastAPI process wasn't meant to need much memory for.
    #
    # Value: #167's own merged PR (Closes #167, "bound chat input and
    # conversation retention") states its worst-case retained-bytes
    # arithmetic explicitly -- 2000 conversations x 50 turns, each turn
    # holding a 1-4000-char question and a <=1536-token
    # (CHAT_MAX_TOKENS, clamp-down-only on BOTH llama_server and ollama)
    # answer plus ~300B of ids -- "~1 GB realistic, ~4 GB pathological".
    # 512m sat BELOW the realistic figure, meaning legitimate load (not an
    # attacker) could OOM-kill the agent -- a worse outage than the DoS
    # this middleware defends against. 2g sits above the ~1GB realistic
    # bound with real headroom, while staying below the ~4GB pathological
    # ceiling so a genuine runaway (a regression in the #167 caps, or a
    # future unbounded term like #174's roster cache before that issue's
    # fix landed) still gets caught rather than silently consuming
    # unbounded host memory.
    #
    # `memswap_limit` is pinned to the SAME value deliberately: Docker's
    # semantics grant swap equal to `mem_limit` when `memswap_limit` is left
    # unset, which would have put the actual kill point at ~4g -- the
    # pathological figure above, not the intended ceiling. Setting both to
    # 2g means 2g total memory+swap, so this is genuinely the ~1GB-realistic
    # / ~4GB-pathological-avoiding ceiling described above, not merely a
    # `mem_limit` number that looks like one.
    mem_limit: 2g
    memswap_limit: 2g
    # `restart: unless-stopped` (previously absent -- Docker's default is
    # `no`): without this, an OOM-kill at the ceiling above leaves the
    # agent DOWN until an operator manually intervenes, unlike every other
    # service in this overlay (ollama/llama-server/llama-server-embed/
    # openemr all set `restart: always`). This is what makes the mem_limit
    # self-healing rather than a second, silent outage on top of whatever
    # triggered the memory growth. `unless-stopped` (not `always`) so an
    # operator's deliberate `docker compose stop agent` is still honored
    # across a host reboot -- there's no other operational reason to prefer
    # one over the other here.
    restart: unless-stopped
    # #180 review finding: traces.db (app/config.py's trace_db_path) backs
    # the P4.5 dashboard and P4.9 review queue -- both meant to aggregate
    # across many chat sessions over time, not just the sessions since the
    # container last started. Without a named volume it lived on the
    # container's writable layer with no declared mount here, so it (and
    # every trace/feedback row in it) was already silently wiped on every
    # container recreation, restart, or OOM-kill -- true before #180 too,
    # just newly consequential now that a missing REQUEST span means a
    # permanent 403 on /feedback instead of a merely-empty dashboard.
    #
    # Mounted at /data/traces, NOT the whole /data (a second review-gate
    # finding): /data also holds copilot_dev_client_creds_path /
    # copilot_prod_client_creds_path (OAuth client secrets) and
    # copilot_ingestion_base_dir (LocalIngestionStore's raw ingested source
    # PDFs/intake forms and extracted patient facts, app/config.py).
    # DEMO_SCRIPT.md's "dies with the container" note about that data is a
    # DELIBERATE property this mount must not change -- a full demo/env
    # reset (docs/TEST_PLAN.md Sec 7, docs/DEMO_SCRIPT.md's reset section)
    # is supposed to wipe the previous run's patient documents and OAuth
    # creds; only the trace store below is meant to survive a plain
    # restart. TRACE_DB_PATH below repoints app/config.py's trace_db_path
    # (default /data/traces.db) inside this scoped mount. See both reset
    # recipes for the matching `docker volume rm agenttracedata` addition.
    volumes:
      - agenttracedata:/data/traces
    environment:
      OPENEMR_BASE_URL: https://openemr
      OLLAMA_BASE_URL: http://ollama:11434
      TRACE_DB_PATH: /data/traces/traces.db
      # #180 review finding: TraceStore.hash_owner_token (services/copilot-agent
      # /app/trace_store.py) keys the /feedback ownership hash with this
      # secret. app/config.py's trace_args_hash_secret deliberately ships NO
      # hardcoded default (this repo is public; a committed literal would be
      # a published key) -- unset, a random 32 bytes is generated PER
      # PROCESS. That was harmless while traces.db never outlived a
      # container (see the volume note above): args_hash is written once
      # and never compared across a process lifetime, so a restart's key
      # rotation was unobservable. owner_token_hash IS compared on a LATER
      # request (a /feedback call after the /chat call that created the
      # trace), so pairing an unset secret with the persistent volume above
      # would recreate exactly the failure #180's review caught: every
      # trace recorded before a restart becomes permanently unownable, and
      # the clinician who legitimately owns it gets a 403 on their own
      # feedback. Required (no default) rather than silently falling back
      # to an empty-string secret, which would be weaker than no pinning at
      # all. Copy docker/development-easy/.env.example to .env in that same
      # directory and fill in a generated value -- see that file for the
      # generation command. scripts/smoke.sh exports a throwaway value of
      # its own before validating this compose file, since it starts no
      # containers and never touches real trace data.
      TRACE_ARGS_HASH_SECRET: "${TRACE_ARGS_HASH_SECRET:?Set TRACE_ARGS_HASH_SECRET -- copy docker/development-easy/.env.example to .env and fill in a generated value; see app/config.py's trace_args_hash_secret docstring}"
      # P3.10e (issue #73): default "llama_server" -- flip to "ollama" for
      # instant rollback of the answer/extract/reranker roles.
      COPILOT_LLM_ENGINE: llama_server
      LLAMA_SERVER_BASE_URL: http://llama-server:8080
      # P3.10b (issue #75): default "llama_server" -- flip to "ollama" for
      # instant rollback of dense-vector embeddings specifically (this flag
      # is independent of COPILOT_LLM_ENGINE above).
      COPILOT_EMBED_ENGINE: llama_server
      LLAMA_SERVER_EMBED_BASE_URL: http://llama-server-embed:8080
      # P5.1 demo dry run (issue #27): the P3.9/P3.9a evidence-retrieval path
      # -- guideline-corpus citations (app.retrieval) AND the per-patient
      # lab_pdf/intake_form document-fact citations
      # (app.chat.get_patient_fact_provider) -- share this ONE flag, default
      # OFF upstream (app/config.py's copilot_evidence_retrieval_enabled
      # docstring: no retrieval call, no extra embedding round trip when
      # off). The demo's citation-overlay (beat 2) and graceful-failure
      # (beat 3) moments are both this feature; a dev stack with the flag at
      # its default silently answers from EMR chart tools alone with zero
      # document citations -- discovered live during the P5.1 dry run, not
      # something the prior research pass could see from static review.
      # Default ON here so a plain `docker compose ... up` demoes the real
      # capability out of the box, matching COPILOT_LLM_ENGINE's default-on
      # precedent above.
      COPILOT_EVIDENCE_RETRIEVAL_ENABLED: "true"
      # #168 (VULN-0001): with COPILOT_PER_USER_TOKEN_ENABLED unset (this
      # dev stack's default), /chat's own bearer check is fail-closed
      # upstream -- every token rejected -- unless this is also set. This
      # dev stack's port is internal-network-only (no host port published)
      # and every real tool call is already driven by the DevTokenBridge's
      # own demo-clinician token (copilot_dev_clinician_username/password,
      # app/config.py), not by whatever bearer the caller sends here, so
      # accepting any non-empty bearer on this ONE dev stack is an explicit,
      # contained opt-in -- not a silent default. See app/config.py's
      # copilot_dev_accept_any_bearer_token docstring: MUST NEVER be set
      # true outside local development.
      COPILOT_DEV_ACCEPT_ANY_BEARER_TOKEN: "true"
    networks:
      - copilot_internal
    depends_on:
      ollama:
        condition: service_started
      # llama-server and llama-server-embed are both default-on (no longer
      # profile-gated), so the agent waits for each to report healthy
      # before starting, same as any other core dependency.
      llama-server:
        condition: service_healthy
      llama-server-embed:
        condition: service_healthy

networks:
  copilot_internal:
    internal: true

volumes:
  ollamamodels: {}
  llamacppmodels: {}
  llamacppembedmodels: {}
  agenttracedata: {}
